/* =====================================================================
   12b. HISTORY, AUTOSAVE, GAPS, CITATIONS, CONSISTENCY
   ===================================================================== */
const KEYS = ['meta','format','papers','skeleton','front','abbrev','figures','tables','refs','recastLog','symbols','glossary','snapshots','ui'];
const serialise = () => JSON.stringify(Object.fromEntries(KEYS.map(k=>[k,state[k]])));
function restore(str){ const d=JSON.parse(str); KEYS.forEach(k=>{ if(d[k]!==undefined) state[k]=d[k]; }); normaliseSkeleton(); }

const past=[], future=[]; let dirty=false, savedAt=null, autoTimer=null;
let memo = {};
const clearMemo = () => { memo = {}; };
function cached(key, fn){ if(!(key in memo)) memo[key] = fn(); return memo[key]; }
function mark(label){
  clearMemo();
  past.push({label, data:serialise()});
  if(past.length>40) past.shift();
  future.length = 0;
  dirty = true;
  clearTimeout(autoTimer); autoTimer = setTimeout(autosave, 2500);
}
function undo(){
  if(!past.length) return toast('Nothing to undo.');
  const step = past.pop();
  future.push({label:step.label, data:serialise()});
  restore(step.data); toast('Undone: '+step.label); dirty=true; render();
}
function redo(){
  if(!future.length) return toast('Nothing to redo.');
  const step = future.pop();
  past.push({label:step.label, data:serialise()});
  restore(step.data); toast('Redone: '+step.label); dirty=true; render();
}
const hasStore = () => !!(window.storage && window.storage.set);
async function autosave(){
  if(!hasStore()) return;
  try{ await window.storage.set('synthesis:project', serialise()); savedAt=Date.now(); dirty=false; updateChrome(); }
  catch(e){ /* keeps working without it */ }
}
async function loadAutosave(){
  if(!hasStore()) return false;
  try{ const r = await window.storage.get('synthesis:project'); if(r && r.value){ restore(r.value); savedAt=Date.now(); return true; } }
  catch(e){}
  return false;
}
function snapNamed(name){
  mark('take a snapshot');
  state.snapshots.unshift({id:uid('v'), name:name||('Snapshot '+(state.snapshots.length+1)), when:new Date().toISOString(), data:serialise()});
  state.snapshots = state.snapshots.slice(0,12);
}

/* ---------- what is still missing ---------- */
const TODO_RE = /\[(?:TODO|TK|XXX?)\b[^\]]*\]|\bTODO:/gi;
function gaps(){ return cached('gaps', _gaps); }
function _gaps(){
  const g=[];
  const add=(tone,txt,view,note)=>g.push({tone,txt,view,note:note||''});
  if(!state.papers.length) add('red','No papers added yet','papers','Everything downstream needs at least one paper.');
  if(!M('title')) add('red','Thesis title missing','setup');
  if(!M('author')||!M('entryNo')) add('red','Candidate name or entry number missing','setup','Both appear on the title page.');
  if(!M('supervisor')) add('red','Supervisor not named','setup','Needed for the certificate.');
  const loose = state.papers.flatMap(p=>p.segments.filter(s=>!s.placedIn && !HELD.includes(s.label)));
  if(loose.length) add('amb', loose.length+' piece'+(loose.length===1?'':'s')+' of your papers not placed','route','Nothing is lost, but it will not appear in the thesis.');
  state.skeleton.filter(isHead).forEach(ch=>{
    const w = chapterWords(ch);
    if(!w) add('amb','Chapter '+numberOf(ch)+' “'+ch.title+'” is empty','route');
    else if(ch.target && w < ch.target*0.4) add('blu','Chapter '+numberOf(ch)+' is well under its target','skeleton', w.toLocaleString()+' of '+ch.target.toLocaleString()+' words.');
  });
  let todo=0;
  state.skeleton.forEach(n=>n.blocks.forEach(b=>{
    const s = b.kind==='bridge' ? b : segById(b.segId);
    if(s && s.text) todo += (s.text.match(TODO_RE)||[]).length;
  }));
  if(todo) add('amb', todo+' TODO marker'+(todo===1?'':'s')+' left in the text','stitch','Anything you wrote as [TODO …] or TK.');
  const xr = (allPlacedText().match(/\[cross-reference to update\]/g)||[]).length;
  if(xr) add('red', xr+' cross-reference'+(xr===1?'':'s')+' still to point somewhere','stitch');
  if(!state.front.abstract.trim()) add('red','Abstract not written','front');
  if(!state.front.acknowledgement.trim()) add('amb','Acknowledgement not written','front');
  const noimg = state.figures.filter(f=>f.newNo && !f.img).length;
  if(noimg) add('blu', noimg+' figure'+(noimg===1?'':'s')+' without an image','figures','Captions are in place; the artwork is not.');
  if(!state.refs.filter(r=>r.keep).length && state.papers.length) add('red','No references merged','refs');
  const cit = auditCitations();
  if(cit.orphans.length) add('red', cit.orphans.length+' citation'+(cit.orphans.length===1?'':'s')+' with no matching reference','refs');
  if(cit.uncited.length) add('blu', cit.uncited.length+' reference'+(cit.uncited.length===1?'':'s')+' never cited','refs','Carried over from a paper whose text you did not use.');
  const noMeta = state.papers.filter(p=>!p.venue||!p.year);
  if(noMeta.length) add('amb', noMeta.length+' paper'+(noMeta.length===1?'':'s')+' missing venue or year','papers','Needed for the List of Publications.');
  const sp = spellingSplit();
  if(sp.split) add('blu','Spelling is mixed between British and American','stitch', sp.brit+' British and '+sp.amer+' American spellings found.');
  return g;
}

/* ---------- citations ---------- */
function auditCitations(){ return cached('cit', _auditCitations); }
function _auditCitations(){
  const text = allPlacedText();
  const cited = new Map();
  const addCite = (sur,yr) => { const k=(sur+'|'+yr).toLowerCase(); if(!cited.has(k)) cited.set(k,{sur,yr,n:0}); cited.get(k).n++; };
  const NAME = "[A-Z][A-Za-zÀ-ÿ'’\\-]{1,}";
  let m;
  const par = /\(([^()]{4,240})\)/g;
  while((m = par.exec(text))){
    const inner = m[1];
    const re = new RegExp(NAME + "(?:\\s+(?:et al\\.?|and\\s+" + NAME + "|&\\s*" + NAME + "))?,?\\s*((?:19|20)\\d{2}[a-z]?)", 'g');
    let x; while((x = re.exec(inner))) addCite(x[0].match(new RegExp(NAME))[0], x[1]);
  }
  const nar = new RegExp("\\b(" + NAME + ")(?:\\s+(?:et al\\.?|and\\s+" + NAME + "|&\\s*" + NAME + "))?\\s*\\(((?:19|20)\\d{2}[a-z]?)\\)", 'g');
  while((m = nar.exec(text))) addCite(m[1], m[2]);
  const listed = state.refs.filter(r=>r.keep).map(r=>{
    const sur = (r.raw.match(/^\s*([A-ZÀ-Ý][A-Za-zÀ-ÿ'’\-]{1,})/)||[,''])[1]||'';
    const yr  = (r.raw.match(/\((\d{4}[a-z]?)\)/)||r.raw.match(/\b((?:19|20)\d{2})\b/)||[,''])[1]||'';
    return {ref:r, sur, yr, hit:false};
  });
  const orphans=[];
  for(const c of cited.values()){
    const hit = listed.find(l => l.sur.toLowerCase()===c.sur.toLowerCase() && l.yr.replace(/[a-z]$/,'')===c.yr.replace(/[a-z]$/,''));
    if(hit) hit.hit = true; else orphans.push(c);
  }
  const numeric = [...text.matchAll(/\[(\d{1,3})(?:\s*[,–-]\s*\d{1,3})*\]/g)].map(x=>+x[1]);
  return {orphans, uncited: listed.filter(l=>!l.hit).map(l=>l.ref), total: cited.size,
    numericMax: numeric.length?Math.max(...numeric):0, numericUsed: numeric.length>0};
}

/* ---------- spelling and terminology ---------- */
const SPELL = [
  ['analyse','analyze'],['analysed','analyzed'],['analysing','analyzing'],['behaviour','behavior'],['behavioural','behavioral'],
  ['categorise','categorize'],['categorised','categorized'],['centre','center'],['centred','centered'],['colour','color'],
  ['conceptualise','conceptualize'],['characterise','characterize'],['emphasise','emphasize'],['favour','favor'],['fulfil','fulfill'],
  ['generalise','generalize'],['generalisability','generalizability'],['labelled','labeled'],['labelling','labeling'],
  ['modelled','modeled'],['modelling','modeling'],['organisation','organization'],['organisational','organizational'],
  ['operationalise','operationalize'],['practise','practice'],['programme','program'],['prioritise','prioritize'],
  ['recognise','recognize'],['summarise','summarize'],['standardise','standardize'],['theorise','theorize'],
  ['utilise','utilize'],['visualise','visualize'],['visualisation','visualization'],['sceptical','skeptical'],
  ['acknowledgement','acknowledgment'],['judgement','judgment'],['enquiry','inquiry'],
  /* reported but never converted: both forms are correct in some sense */
  ['practise','practice',1],['programme','program',1],['towards','toward',1],['learnt','learned',1],['whilst','while',1]
];
function spellingSplit(){ return cached('spell', ()=>{
  const freq = new Map();
  for(const w of (allPlacedText().toLowerCase().match(/[a-z]+/g)||[])) freq.set(w,(freq.get(w)||0)+1);
  let brit=0, amer=0; const detail=[];
  SPELL.forEach(([b,a,risky])=>{
    const nb = freq.get(b)||0, na = freq.get(a)||0;
    if(!risky){ brit+=nb; amer+=na; }
    if(nb&&na) detail.push({b,a,nb,na,risky:!!risky});
  });
  return {brit, amer, detail, split: brit>0 && amer>0};
}); }
function harmoniseSpelling(target){
  mark('harmonise spelling');
  let n=0;
  state.papers.forEach(p=>p.segments.forEach(s=>{
    if(!s.placedIn) return;
    SPELL.forEach(([b,a,risky])=>{
      if(risky) return;
      const from = target==='british'? a : b, to = target==='british'? b : a;
      const re = new RegExp('\\b'+from+'\\b','g');
      n += (s.text.match(re)||[]).length;
      s.text = s.text.replace(re,to);
      const Re = new RegExp('\\b'+from[0].toUpperCase()+from.slice(1)+'\\b','g');
      n += (s.text.match(Re)||[]).length;
      s.text = s.text.replace(Re, to[0].toUpperCase()+to.slice(1));
    });
    s.wc = words(s.text);
  }));
  state.ui.spelling = target;
  return n;
}
function glossaryScan(){
  return state.glossary.filter(g=>g.term).map(g=>{
    const variants = (g.variants||'').split(',').map(v=>v.trim()).filter(Boolean);
    const t = allPlacedText();
    return {g, hits: variants.map(v=>({v, n:(t.match(new RegExp('\\b'+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi'))||[]).length})).filter(x=>x.n)};
  }).filter(x=>x.hits.length);
}
function applyGlossary(){
  mark('apply preferred terms');
  let n=0;
  state.glossary.filter(g=>g.term).forEach(g=>{
    (g.variants||'').split(',').map(v=>v.trim()).filter(Boolean).forEach(v=>{
      const re = new RegExp('\\b'+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
      state.papers.forEach(p=>p.segments.forEach(s=>{
        if(!s.placedIn) return;
        n += (s.text.match(re)||[]).length;
        s.text = s.text.replace(re, g.term);
        s.wc = words(s.text);
      }));
    });
  });
  return n;
}

function showPalette(){
  const items = [];
  STEPS.forEach(([v,t])=>items.push({t:'Go to '+t, k:'step', go:()=>{state.view=v;}}));
  [['format','Format profile'],['help','Guide & shortcuts']].forEach(([v,t])=>items.push({t:'Go to '+t, k:'step', go:()=>{state.view=v;}}));
  state.skeleton.forEach(n=>items.push({t:numberOf(n)+' '+n.title, k:isHead(n)?'chapter':'section', go:()=>{state.view='skeleton';}}));
  state.papers.forEach(p=>p.segments.forEach(s=>items.push({t:p.code+' · '+s.heading, k:LABEL_NAME[s.label], go:()=>{state.view='segments';}})));
  state.refs.forEach(r=>items.push({t:r.raw.slice(0,90), k:'reference', go:()=>{state.view='refs';}}));
  $('#overlay').innerHTML = `<div class="palette"><div class="palette-box">
    <input type="text" id="palQ" placeholder="Find a chapter, a section of a paper, a reference, or a step" autocomplete="off">
    <div class="pal-list" id="palList"></div></div></div>`;
  const q=$('#palQ'), list=$('#palList'); let sel=0, shown=[];
  const draw=()=>{
    const term=q.value.toLowerCase().trim();
    shown = (term? items.filter(i=>i.t.toLowerCase().includes(term)) : items).slice(0,60);
    list.innerHTML = shown.length? shown.map((i,n)=>`<div class="pal-item ${n===sel?'sel':''}" data-i="${n}"><span class="w">${esc(i.t)}</span><span class="chip">${esc(i.k)}</span></div>`).join('')
      : '<div class="pal-item"><span class="w mut">Nothing matches that.</span></div>';
    $$('.pal-item',list).forEach(el=>el.onclick=()=>pick(+el.dataset.i));
  };
  const pick=n=>{ const it=shown[n]; if(!it) return; $('#overlay').innerHTML=''; it.go(); render(); };
  q.oninput=()=>{sel=0;draw();};
  q.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,shown.length-1);draw();}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);draw();}
    else if(e.key==='Enter'){e.preventDefault();pick(sel);}
    else if(e.key==='Escape'){$('#overlay').innerHTML='';}
  };
  $('.palette').onclick=e=>{ if(e.target.classList.contains('palette')) $('#overlay').innerHTML=''; };
  draw(); q.focus();
}

      C('Results and discussion','r_studyres'),S('Findings','r_studyres'),S('Discussion','r_studydisc'),S('Implications','r_implic'),
      C('Conclusions','r_concl'),S('Conclusions','r_concl'),S('Limitations','r_limits'),S('Future work','r_future')];

    const S=(t,r,scope)=>({id:uid('n'),kind:'section',title:t,role:r,scope:scope||'',brief:'',blocks:[]});

      C('Literature review','r_lit'),S('State of the art','r_lit'),S('Research gap','r_gap'),
      C('Research methodology','r_method'),S('Overall design','r_method')];

      out.push(C('Study '+(i+1)+' — '+p.title.slice(0,52),'r_studyres',p.id));

      out.push(S('Results','r_studyres',p.id));

    });

      <div class="row"><h3 style="flex:1">${esc(s.heading)}</h3><button class="btn ghost sm" id="closeSeg">Close</button></div>
      <p class="tiny mut">${p.code} · ${esc(LABEL_NAME[s.label])} · ${s.wc} words</p>
      <textarea rows="14" data-segtext="${s.id}" style="font-family:var(--doc);font-size:14px">${esc(s.text)}</textarea>
      <p class="hint">Edits here go into the thesis. Word counts update when you click away.</p></div>`;
    $('#closeSeg',root).onclick=()=>{$('#segReader',root).innerHTML='';};
    $(`[data-segtext="${s.id}"]`,root).addEventListener('change',ev=>{ s.text=ev.target.value; s.wc=words(s.text); updateChrome(); });
    $('#segReader',root).scrollIntoView({behavior:'smooth',block:'nearest'});
  },root);
  const aiSeg = $('#btnAiSeg',root);
  if(aiSeg) aiSeg.onclick = async ()=>{
    aiSeg.disabled=true; aiSeg.textContent='Reading…';
    for(const p of state.papers){
      const list = p.segments.map((s,i)=>`${i}. "${s.heading}" — ${s.text.slice(0,180).replace(/\s+/g,' ')}`).join('\n');
      const out = await assist(
        `Label each numbered section of an academic paper with exactly one code from this list:\n${LABELS.map(([k,n])=>k+' = '+n).join('\n')}\n\nSections:\n${list}\n\nReply with only lines of the form index:code. No other text.`,
        'You classify sections of academic papers. Reply only in the requested format.');
      if(!out) break;
      out.split('\n').forEach(line=>{
        const m = line.match(/^\s*(\d+)\s*[:.]\s*([a-z]+)/i);
        if(m && p.segments[+m[1]] && LABEL_NAME[m[2]]) p.segments[+m[1]].label = m[2];
      });
    }
    render();
  };

  /* skeleton */
  bind('[data-add]','click',e=>{
    mark('add a heading');
    state.skeleton.push({id:uid('n'),kind:e.currentTarget.dataset.add,title:'New '+e.currentTarget.dataset.add,role:'none',scope:'',brief:'',blocks:[]});
    render();
  },root);
  bind('[data-nodetitle]','input',e=>{ const n=nodeById(e.target.dataset.nodetitle); if(n) n.title=e.target.value; },root);
  bind('[data-noderole]','change',e=>{ const n=nodeById(e.target.dataset.noderole); if(n) n.role=e.target.value; },root);
  bind('[data-nodescope]','change',e=>{ const n=nodeById(e.target.dataset.nodescope); if(n) n.scope=e.target.value; },root);
  const move=(id,d)=>{ const i=state.skeleton.findIndex(n=>n.id===id); const j=i+d;
    if(i<0||j<0||j>=state.skeleton.length) return;
    [state.skeleton[i],state.skeleton[j]]=[state.skeleton[j],state.skeleton[i]]; render(); };
  bind('[data-nodeup]','click',e=>move(e.currentTarget.dataset.nodeup,-1),root);
  bind('[data-nodedown]','click',e=>move(e.currentTarget.dataset.nodedown,1),root);
  bind('[data-nodedel]','click',e=>{
    const n=nodeById(e.currentTarget.dataset.nodedel); if(!n) return;
    if(n.blocks.length && !confirm('That slot holds '+n.blocks.length+' piece(s). They will be unplaced. Continue?')) return;
    mark('delete a heading');
    n.blocks.forEach(b=>{const s=segById(b.segId); if(s) s.placedIn=null;});
    state.skeleton = state.skeleton.filter(x=>x.id!==n.id); render();
  },root);

  /* placement */
  const auto = $('#btnAuto',root);
  if(auto) auto.onclick=()=>{ mark('place everything'); const r=autoPlace(false); toast(`${r.placed} placed, ${r.skipped} left aside.`); render(); };
  const autoL = $('#btnAutoLoose',root);
  if(autoL) autoL.onclick=()=>{ mark('place the loose pieces'); const r=autoPlace(true); toast(`${r.placed} placed.`); render(); };
  const clr = $('#btnClearAll',root);
  if(clr) clr.onclick=()=>{ if(!confirm('Unplace everything?')) return; mark('unplace everything');
    state.skeleton.forEach(n=>n.blocks=[]); state.papers.forEach(p=>p.segments.forEach(s=>s.placedIn=null)); state.picked=null; render(); };
  const unp = $('#btnUnpick',root); if(unp) unp.onclick=()=>{ state.picked=null; render(); };
  bind('[data-pick]','click',e=>{
    const id=e.currentTarget.dataset.pick;
    state.picked = state.picked===id ? null : id; render();
  },root);
  bind('[data-drop]','click',e=>{
    if(!state.picked) return;
    mark('place a piece');
    placeSeg(state.picked, e.currentTarget.dataset.drop);
    state.picked=null; renumberCaptions(); render();
  },root);
  bind('[data-editblk]','click',e=>{
    e.stopPropagation();
    const s=segById(e.currentTarget.dataset.editblk); if(!s) return;
    const p=paperOfSeg(s.id), row=e.currentTarget.closest('.blk');
    if(row.nextElementSibling && row.nextElementSibling.classList.contains('inline-edit')){ row.nextElementSibling.remove(); return; }
    const box=document.createElement('div');
    box.className='inline-edit';
    box.innerHTML=`<p class="tiny mut" style="margin:6px 0 3px">${esc(p?p.code:'')} · ${esc(s.heading)} · ${s.wc} words</p>
      <textarea rows="10" style="font-family:var(--doc);font-size:14px">${esc(s.text)}</textarea>
      <p class="hint">Edits go straight into the thesis. Click away to keep them.</p>`;
    row.after(box);
    const ta=box.querySelector('textarea');
    ta.addEventListener('change',()=>{ mark('edit text'); s.text=ta.value; s.wc=words(s.text); toast('Saved to '+(p?p.code:'the thesis')+'.'); render(); });
    ta.focus();
  },root);
  bind('[data-unplace]','click',e=>{ e.stopPropagation(); mark('take a piece out'); unplaceSeg(e.currentTarget.dataset.unplace); renumberCaptions(); render(); },root);
  const blkMove=(key,d)=>{ const [nid,bi]=key.split('|'); const n=nodeById(nid); const i=+bi, j=i+d;
    if(!n||j<0||j>=n.blocks.length) return; [n.blocks[i],n.blocks[j]]=[n.blocks[j],n.blocks[i]]; render(); };
  bind('[data-blkup]','click',e=>{e.stopPropagation();blkMove(e.currentTarget.dataset.blkup,-1);},root);
  bind('[data-blkdown]','click',e=>{e.stopPropagation();blkMove(e.currentTarget.dataset.blkdown,1);},root);

  /* stitch */
  const rc = $('#btnRecast',root);
  if(rc) rc.onclick=()=>{
    const cats = $$('.recast-cat',root).filter(c=>c.checked).map(c=>c.value);
    if(!cats.length) return toast('Pick at least one kind.');
    mark('recast the voice');
    const n = applyRecast(cats); toast(n+' passage'+(n===1?'':'s')+' recast.'); render();
  };
  const ov = $('#btnOverlap',root);
  if(ov) ov.onclick=()=>{
    ov.disabled=true; ov.textContent='Comparing…';
    setTimeout(()=>{
      const hits = findOverlaps();
      $('#overlapOut',root).innerHTML = hits.length ? hits.slice(0,20).map(h=>`
        <div class="flag">
          <h5>${Math.round(h.j*100)}% shared wording · ${h.a.paper?h.a.paper.code:'?'} → ${esc(h.a.node.title)} &nbsp;vs&nbsp; ${h.b.paper?h.b.paper.code:'?'} → ${esc(h.b.node.title)}</h5>
          <div class="quote">${esc(h.a.text.slice(0,240))}…</div>
          <div class="quote">${esc(h.b.text.slice(0,240))}…</div>
        </div>`).join('') + (hits.length>20?`<p class="tiny mut">…and ${hits.length-20} more pairs.</p>`:'')
        : `<div class="empty"><strong>No repeated passages found</strong>Nothing above 16% shared wording between paragraphs from different papers.</div>`;
      ov.disabled=false; ov.textContent='Look for repeats';
    }, 30);
  };
  bind('[data-writebridge]','click',async e=>{
    const n = nodeById(e.currentTarget.dataset.writebridge); if(!n) return;
    const i = state.skeleton.indexOf(n);
    const prev = state.skeleton.slice(0,i).reverse().find(x=>x.kind==='chapter');
    const btn = e.currentTarget; btn.disabled=true; btn.textContent='Drafting…';
    const out = await assist(
      `Write a single linking paragraph, 70 to 110 words, that opens a PhD thesis chapter. It should recall what the previous chapter established and state what this chapter does, in an academic register, first person singular, British spelling. Do not use headings or lists.\n\nPrevious chapter: "${prev?prev.title:'the introduction'}"\nThis chapter: "${n.title}"\nWhat this chapter covers: ${n.brief||'see title'}\nThesis topic: ${M('title')||'a design research thesis'}`,
      'You write connective prose for doctoral theses. Return only the paragraph.');
    btn.disabled=false; btn.textContent='Draft one with writing assist';
    if(!out) return;
    n.blocks = n.blocks.filter(b=>!(b.kind==='bridge'&&b.at==='open'));
    n.blocks.unshift({kind:'bridge', at:'open', text:out});
    render();
  },root);
  bind('[data-bridge]','change',e=>{
    const [nid] = e.target.dataset.bridge.split('|');
    const n=nodeById(nid); if(!n) return;
    n.blocks = n.blocks.filter(b=>!(b.kind==='bridge'&&b.at==='open'));
    if(e.target.value.trim()) n.blocks.unshift({kind:'bridge',at:'open',text:e.target.value});
  },root);

  /* front matter */
  const ba=$('#btnBuildAck',root);
  if(ba) ba.onclick=()=>{ mark('draft the acknowledgement'); state.front.acknowledgement = genAcknowledgement(); render(); };
  const da=$('#btnDraftAbstract',root);
  if(da) da.onclick=async()=>{
    const abs = state.papers.flatMap(p=>p.segments.filter(s=>s.label==='abstract').map(s=>p.code+': '+s.text));
    if(!abs.length) return toast('No paper abstracts found. Label them on the Segments step.');
    da.disabled=true; da.textContent='Drafting…';
    const out = await assist(
      `Write one PhD thesis abstract of ${Math.min(500,state.format.abstractWordCap)} words or fewer from these abstracts of the candidate's published papers. It must read as one continuous argument, not a summary of separate studies: state the problem, the approach, what was found across the studies, and the contribution. Academic register, first person singular where a voice is needed, British spelling, no headings or lists.\n\nThesis title: ${M('title')}\nChapters: ${state.skeleton.filter(n=>n.kind==='chapter').map(n=>n.title).join('; ')}\n\nPaper abstracts:\n${abs.join('\n\n')}`,
      'You write abstracts for doctoral theses. Return only the abstract text.');
    da.disabled=false; da.textContent='Draft from the paper abstracts';
    if(out){ state.front.abstract = out; render(); }
  };
  const rn=$('#btnRenumber',root); if(rn) rn.onclick=()=>{ mark('renumber figures and tables'); renumberCaptions(); toast('Renumbered chapter-wise.'); render(); };
  const ab=$('#btnAbbrev',root); if(ab) ab.onclick=()=>{ detectAbbrev(); toast(state.abbrev.length+' abbreviation(s).'); render(); };
  const aab=$('#btnAddAbbrev',root); if(aab) aab.onclick=()=>{ state.abbrev.push({id:uid('a'),short:'',long:''}); render(); };
  bind('[data-cap]','input',e=>{ const c=[...state.figures,...state.tables].find(x=>x.id===e.target.dataset.cap); if(c) c.caption=e.target.value; },root);
  bind('[data-delcap]','click',e=>{ const id=e.currentTarget.dataset.delcap;
    state.figures=state.figures.filter(c=>c.id!==id); state.tables=state.tables.filter(c=>c.id!==id); render(); },root);
  bind('[data-ab]','input',e=>{ const a=state.abbrev.find(x=>x.id===e.target.dataset.ab); if(a) a[e.target.dataset.abk]=e.target.value; },root);
  bind('[data-delab]','click',e=>{ state.abbrev=state.abbrev.filter(a=>a.id!==e.currentTarget.dataset.delab); render(); },root);

  /* references */
  const rh=$('#btnReharvest',root);
  if(rh) rh.onclick=()=>{ mark('re-read the references'); state.refs=[]; state.papers.forEach(harvestRefs); toast(state.refs.length+' reference(s) merged.'); render(); };
  const ar=$('#btnAddRef',root); if(ar) ar.onclick=()=>{ state.refs.unshift({id:uid('r'),key:uid('k'),raw:'',from:[],keep:true}); render(); };
  const sr=$('#btnSortRefs',root); if(sr) sr.onclick=()=>{ sortRefs(); render(); };
  bind('[data-refkeep]','change',e=>{ const r=state.refs.find(x=>x.id===e.target.dataset.refkeep); if(r){r.keep=e.target.checked; updateChrome();} },root);
  bind('[data-refraw]','input',e=>{ const r=state.refs.find(x=>x.id===e.target.dataset.refraw); if(r) r.raw=e.target.value; },root);
  bind('[data-delref]','click',e=>{ state.refs=state.refs.filter(r=>r.id!==e.currentTarget.dataset.delref); render(); },root);

  /* format */
  const wa=$('#btnWelcomeAgain',root); if(wa) wa.onclick=showWelcome;
  const rf=$('#btnResetFormat',root); if(rf) rf.onclick=()=>{ mark('reset the format profile'); state.format=iitdFormat(); toast('Profile reset.'); render(); };
  const ak=$('#aiKey',root); if(ak) ak.addEventListener('input',()=>{ state.ai.key=ak.value.trim(); });

  /* output */
  const bw=$('#btnWord',root); if(bw) bw.onclick=exportWord;
  const bp=$('#btnPrint',root); if(bp) bp.onclick=()=>window.print();
  const bt=$('#btnTex',root); if(bt) bt.onclick=exportLatex;
  const bm=$('#btnMd',root); if(bm) bm.onclick=exportMarkdown;
}

/* rail + global */
$$('.rail-btn').forEach(b=>b.addEventListener('click',()=>{ state.view=b.dataset.view; state.picked=null; render(); }));
$('#btnSave').onclick = () => { exportProject(); dirty=false; savedAt=Date.now(); updateChrome(); };
$('#btnOpen').onclick = () => $('#fileProject').click();
$('#btnUndo').onclick = undo;
$('#btnRedo').onclick = redo;
$('#btnFind').onclick = showPalette;
$('#fileProject').onchange = async e => {
  const f=e.target.files[0]; if(!f) return;
  importProject(await f.text()); e.target.value=''; dirty=false;
};
document.addEventListener('keydown', e=>{
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==='Escape'){ if($('#overlay').innerHTML){ $('#overlay').innerHTML=''; return; } if(state.picked){ state.picked=null; render(); } }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); $('#btnSave').click(); }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); showPalette(); }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if(!typing && !e.metaKey && !e.ctrlKey && !e.altKey){
    const i = STEPS.findIndex(s=>s[0]===state.view);
    if(e.key===']' && i>=0 && i<STEPS.length-1){ state.view=STEPS[i+1][0]; render(); }
    if(e.key==='[' && i>0){ state.view=STEPS[i-1][0]; render(); }
    if(e.key==='?'){ state.view='help'; render(); }
  }
});
window.addEventListener('beforeunload', e=>{
  if(!dirty || !state.papers.length) return;
  e.preventDefault(); e.returnValue = '';
});

(async ()=>{
  normaliseSkeleton();
  const resumed = await loadAutosave();
  if(resumed && (state.papers.length || M('title'))){
    state.ui.welcomed = true; state.view = 'home';
    render(); toast('Picked up where you left off. Save a file to keep a copy.');
  } else {
    render();
    if(!state.ui.welcomed && !state.papers.length) showWelcome();
  }
})();
</script>
</body>
</html>
