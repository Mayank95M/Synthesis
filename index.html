<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SynThesis — thesis assembly for IIT Delhi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15181c; --ink2:#3a4048; --ink3:#6e7680; --ink4:#9aa09a;
  --stock:#e9eae5; --stock2:#f1f2ee; --sheet:#ffffff;
  --rule:#c6c9c1; --rule2:#dfe1da;
  --repro:#2e6e93; --repro-tint:#dceaf2; --repro-deep:#1d4f6b;
  --proof:#c33a2b; --proof-tint:#f7e2de;
  --set:#2f6b4f; --set-tint:#dfece5;
  --amber:#8a6410; --amber-tint:#f4ead2;
  --ui:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --doc:'Tinos','Times New Roman',Times,serif;
  --rail:212px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ui); background:var(--stock); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--repro);outline-offset:2px}
a{color:var(--repro)}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;
  padding:18px 24px 14px; background:var(--sheet);
  border-bottom:1px solid var(--ink);
}
.mast-mark{font-size:11px;letter-spacing:.14em;color:var(--ink3);margin:0 0 4px}
.mast-title{font-size:26px;font-weight:600;letter-spacing:-.022em;margin:0;line-height:1.1}
.mast-title span{color:var(--ink4);font-weight:400}
.mast-sub{margin:5px 0 0;font-size:12.5px;color:var(--ink2)}
.mast-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.gauge{display:flex;align-items:center;gap:9px;padding:6px 11px;border:1px solid var(--rule);background:var(--stock2)}
.gauge-bar{width:104px;height:7px;background:var(--rule2);position:relative;overflow:hidden}
.gauge-bar i{position:absolute;inset:0 auto 0 0;background:var(--repro);width:0%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gauge-txt{font-size:11.5px;color:var(--ink2);white-space:nowrap}

/* ---------- shell ---------- */
.shell{display:flex;min-height:calc(100vh - 108px);align-items:stretch;padding-bottom:32px}
.rail{
  width:var(--rail);flex:0 0 var(--rail);background:var(--sheet);
  border-right:1px solid var(--rule);padding:14px 0 40px;position:sticky;top:0;align-self:flex-start;
  max-height:calc(100vh - 32px);overflow-y:auto;
}
.rail-group{padding:0 0 14px}
.rail-cap{font-size:10.5px;letter-spacing:.13em;color:var(--ink4);padding:8px 16px 5px}
.rail-btn{
  display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-left:3px solid transparent;
  padding:7px 16px;cursor:pointer;color:var(--ink2);font-size:13.5px;
}
.rail-btn:hover{background:var(--stock2);color:var(--ink)}
.rail-btn.on{border-left-color:var(--repro);color:var(--ink);font-weight:600;background:var(--repro-tint)}
.rail-num{font-size:10.5px;color:var(--ink4);width:12px;flex:0 0 12px}
.rail-btn.on .rail-num{color:var(--repro)}
.rail-tag{margin-left:auto;font-size:10.5px;color:var(--ink4);background:var(--stock);padding:1px 5px;border:1px solid var(--rule2)}
.rail-btn.on .rail-tag{background:var(--sheet)}

.stage{flex:1;min-width:0;padding:22px 26px 90px;max-width:1500px}
.stage-head{margin:0 0 16px;padding-bottom:11px;border-bottom:1px solid var(--rule)}
.stage-head h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.015em}
.stage-head p{margin:5px 0 0;color:var(--ink2);max-width:64ch;font-size:13px}

/* ---------- generic bits ---------- */
.panel{background:var(--sheet);border:1px solid var(--rule);padding:16px;margin:0 0 14px}
.panel > h3{margin:0 0 3px;font-size:14px;font-weight:600}
.panel > h3 + p{margin:0 0 12px;color:var(--ink3);font-size:12.5px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.split{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.15fr);gap:14px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:1fr}}

label.f{display:block;margin:0 0 10px}
label.f > span{display:block;font-size:11.5px;color:var(--ink2);margin:0 0 3px}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:6px 8px;border:1px solid var(--rule);background:var(--sheet);border-radius:0;
}
textarea{line-height:1.55;resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--repro);outline:none;box-shadow:0 0 0 2px var(--repro-tint)}
.hint{font-size:11.5px;color:var(--ink3);margin:4px 0 0}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px;cursor:pointer;
  border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:0;font-size:13px;font-weight:500;
}
.btn:hover{background:var(--ink2);border-color:var(--ink2)}
.btn.ghost{background:var(--sheet);color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--stock2);border-color:var(--ink3)}
.btn.key{background:var(--repro);border-color:var(--repro)}
.btn.key:hover{background:var(--repro-deep);border-color:var(--repro-deep)}
.btn.sm{padding:3px 8px;font-size:11.5px;font-weight:400}
.btn.danger{background:var(--sheet);color:var(--proof);border-color:var(--proof-tint)}
.btn.danger:hover{background:var(--proof-tint)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 6px;border:1px solid var(--rule);background:var(--stock2);color:var(--ink2);white-space:nowrap}
.chip.b{background:var(--repro-tint);border-color:#bcd9e8;color:var(--repro-deep)}
.chip.r{background:var(--proof-tint);border-color:#eec8c1;color:var(--proof)}
.chip.g{background:var(--set-tint);border-color:#c3ddcf;color:var(--set)}
.chip.a{background:var(--amber-tint);border-color:#e2d3ab;color:var(--amber)}

.empty{border:1px dashed var(--rule);padding:26px 20px;text-align:center;color:var(--ink3);background:var(--stock2)}
.empty strong{display:block;color:var(--ink);font-size:14px;margin:0 0 5px;font-weight:600}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th{text-align:left;font-weight:600;font-size:11px;color:var(--ink3);border-bottom:1px solid var(--ink);padding:5px 7px}
table.data td{border-bottom:1px solid var(--rule2);padding:6px 7px;vertical-align:top}
.mut{color:var(--ink3)}
.tiny{font-size:11.5px}

/* ---------- papers ---------- */
.paper-card{border:1px solid var(--rule);background:var(--sheet);margin:0 0 10px;display:flex}
.paper-band{width:7px;flex:0 0 7px}
.paper-body{flex:1;min-width:0;padding:12px 14px}
.paper-body h4{margin:0;font-size:14px;font-weight:600;line-height:1.3}
.seglist{margin:10px 0 0;border-top:1px solid var(--rule2)}
.segrow{display:flex;gap:9px;align-items:center;padding:5px 0;border-bottom:1px solid var(--rule2);font-size:12.5px}
.segrow select{width:auto;min-width:126px;padding:2px 5px;font-size:11.5px}
.seg-h{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- routing ---------- */
.slug{
  border:1px solid var(--rule);background:var(--sheet);margin:0 0 6px;cursor:pointer;
  display:flex;align-items:stretch;transition:transform .12s ease, box-shadow .12s ease;
}
.slug:hover{border-color:var(--ink3)}
.slug.picked{border-color:var(--repro);box-shadow:0 0 0 2px var(--repro-tint);transform:translateX(3px)}
.slug.done{opacity:.5}
.slug-band{width:5px;flex:0 0 5px}
.slug-main{padding:7px 9px;flex:1;min-width:0}
.slug-top{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--ink3)}
.slug-h{font-size:12.5px;font-weight:500;margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slug-x{font-size:11.5px;color:var(--ink3);margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.node{border:1px solid var(--rule);background:var(--sheet);margin:0 0 6px}
.node.sub{margin-left:20px}
.node.subsub{margin-left:40px}
.node-head{display:flex;gap:9px;align-items:center;padding:8px 10px}
.node-no{font-size:11.5px;color:var(--ink3);flex:0 0 auto;min-width:26px}
.node-t{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node.droppable{cursor:copy}
.node.droppable:hover{border-color:var(--ink3);background:var(--stock2)}
.node.target{border-color:var(--repro);background:var(--repro-tint)}
.node.target .node-t{color:var(--repro-deep)}
.spine{height:5px;display:flex;background:var(--rule2)}
.spine i{height:100%;display:block;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.blocks{padding:0 10px 8px}
.blk{display:flex;gap:8px;align-items:center;font-size:12px;padding:4px 0;border-top:1px solid var(--rule2)}
.blk-dot{width:8px;height:8px;flex:0 0 8px}
.blk-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- document preview ---------- */
.sheetwrap{background:var(--stock);padding:14px;border:1px solid var(--rule);max-height:78vh;overflow:auto}
.docsheet{background:#fff;margin:0 auto 16px;box-shadow:0 1px 0 var(--rule),0 3px 12px rgba(0,0,0,.07);font-family:var(--doc);color:#000}
.docsheet h1,.docsheet h2,.docsheet h3,.docsheet h4{font-family:var(--doc)}
.docsheet .pg-break{border-top:1px dashed var(--rule);margin:0}

/* ---------- flags ---------- */
.flag{border:1px solid var(--rule);border-left:3px solid var(--proof);background:var(--sheet);padding:9px 11px;margin:0 0 7px}
.flag.warn{border-left-color:var(--amber)}
.flag.info{border-left-color:var(--repro)}
.flag h5{margin:0 0 3px;font-size:12.5px;font-weight:600}
.flag p{margin:0;font-size:12px;color:var(--ink2)}
.quote{font-family:var(--doc);font-size:13px;background:var(--stock2);padding:7px 9px;margin:6px 0 0;border-left:2px solid var(--rule)}
mark{background:#f6e08a;padding:0 1px}

.colophon{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;align-items:center;gap:16px;
  padding:6px 24px;background:var(--sheet);border-top:1px solid var(--ink);
  font-size:11.5px;color:var(--ink2);
}
.colophon .rule{flex:1;height:1px;background:var(--rule2);min-width:12px}
.colophon .note{color:var(--ink4);white-space:nowrap}
@media (max-width:560px){.colophon{padding:6px 14px;font-size:11px}.colophon .note{display:none}}
.toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.check{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--rule2);font-size:12.5px}
.check-m{flex:0 0 15px;font-weight:700}
.ok{color:var(--set)}.no{color:var(--proof)}.mid{color:var(--amber)}
details.fold{border:1px solid var(--rule2);margin:0 0 7px;background:var(--stock2)}
details.fold > summary{cursor:pointer;padding:6px 9px;font-size:12.5px;font-weight:500}
details.fold > div{padding:0 9px 9px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:820px){
  .shell{flex-direction:column}
  .rail{width:100%;flex:0 0 auto;position:static;max-height:none;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule);padding:0}
  .rail-group{display:flex;padding:0}
  .rail-cap{display:none}
  .rail-btn{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;padding:10px 13px}
  .rail-btn.on{border-left:0;border-bottom-color:var(--repro)}
  .stage{padding:16px 14px 80px}
}
@media print{
  .masthead,.rail,.colophon,.noprint{display:none!important}
  .stage{padding:0;max-width:none}
  .sheetwrap{max-height:none;overflow:visible;padding:0;border:0;background:#fff}
  .docsheet{box-shadow:none;margin:0}
  body{background:#fff}
}
</style>
</head>
<body>

<header class="masthead">
  <div>
    <p class="mast-mark">Indian Institute of Technology Delhi &nbsp;·&nbsp; doctoral thesis assembly</p>
    <h1 class="mast-title" id="mastTitle">SynThesis <span>— untitled thesis</span></h1>
    <p class="mast-sub" id="mastSub">Add your papers, lay out the chapters, and let the pieces fall where they belong.</p>
  </div>
  <div class="mast-right">
    <div class="gauge" title="Share of source material placed into chapters">
      <div class="gauge-bar"><i id="gaugeFill"></i></div>
      <span class="gauge-txt" id="gaugeTxt">nothing set</span>
    </div>
    <button class="btn ghost sm" id="btnSave">Save project</button>
    <button class="btn ghost sm" id="btnOpen">Open project</button>
    <input type="file" id="fileProject" accept=".json" hidden>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail">
    <div class="rail-group">
      <p class="rail-cap">Gather</p>
      <button class="rail-btn on" data-view="setup"><span class="rail-num">1</span>Thesis details</button>
      <button class="rail-btn" data-view="papers"><span class="rail-num">2</span>Papers<span class="rail-tag" id="tagPapers">0</span></button>
      <button class="rail-btn" data-view="segments"><span class="rail-num">3</span>Segments<span class="rail-tag" id="tagSegs">0</span></button>
      <p class="rail-cap">Set</p>
      <button class="rail-btn" data-view="skeleton"><span class="rail-num">4</span>Chapters<span class="rail-tag" id="tagNodes">0</span></button>
      <button class="rail-btn" data-view="route"><span class="rail-num">5</span>Placement<span class="rail-tag" id="tagUnplaced">—</span></button>
      <button class="rail-btn" data-view="stitch"><span class="rail-num">6</span>Stitching</button>
      <p class="rail-cap">Finish</p>
      <button class="rail-btn" data-view="front"><span class="rail-num">7</span>Front &amp; back matter</button>
      <button class="rail-btn" data-view="refs"><span class="rail-num">8</span>References<span class="rail-tag" id="tagRefs">0</span></button>
      <button class="rail-btn" data-view="proof"><span class="rail-num">9</span>Proof check</button>
      <button class="rail-btn" data-view="output"><span class="rail-num">10</span>Preview &amp; export</button>
      <p class="rail-cap">Rules</p>
      <button class="rail-btn" data-view="format"><span class="rail-num">§</span>Format profile</button>
      <button class="rail-btn" data-view="help"><span class="rail-num">?</span>How this works</button>
    </div>
  </nav>
  <main class="stage" id="stage"></main>
</div>
<footer class="colophon">
  <span>&copy; 2026 Mayank Mayookh</span>
  <span class="rule"></span>
  <span class="note">SynThesis &middot; nothing leaves this browser</span>
</footer>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   SynThesis — a thesis assembler for compilation-style PhD theses
   Single file. No server, no storage APIs. Projects save as .json.
   ===================================================================== */

const INK = ['#2e6e93','#c33a2b','#6b4e93','#2f6b4f','#b07b14','#8c3f63','#17667a','#7a5c3e','#4a5568','#963b7a'];
const uid = (p='x') => p + Math.random().toString(36).slice(2,9);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words = s => (String(s||'').trim().match(/[A-Za-z0-9'’\-]+/g)||[]).length;
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));

/* ---- controlled vocabulary of what a paper fragment IS ---- */
const LABELS = [
  ['abstract',     'Abstract'],
  ['intro',        'Introduction / motivation'],
  ['litreview',    'Literature / related work'],
  ['gap',          'Research gap'],
  ['question',     'Aim, questions, objectives'],
  ['framework',    'Theory / conceptual framework'],
  ['method',       'Method / study design'],
  ['instrument',   'Instrument, protocol, materials'],
  ['participants', 'Participants / sample'],
  ['analysis',     'Analysis procedure'],
  ['results',      'Results / findings'],
  ['artefact',     'Artefact, tool, system description'],
  ['evaluation',   'Evaluation / validation'],
  ['discussion',   'Discussion / interpretation'],
  ['implications', 'Implications / contributions'],
  ['limitations',  'Limitations'],
  ['conclusion',   'Conclusion'],
  ['future',       'Future work'],
  ['references',   'Reference list'],
  ['ack',          'Acknowledgement (paper)'],
  ['appendix',     'Appendix material'],
  ['drop',         'Do not carry over']
];
const LABEL_NAME = Object.fromEntries(LABELS);

/* ---- what a thesis slot is FOR. Placement = label -> role. ---- */
const ROLES = [
  ['none',        'No automatic intake'],
  ['r_context',   'Context and motivation'],
  ['r_lit',       'Literature review'],
  ['r_gap',       'Research gap'],
  ['r_aims',      'Aims, questions, objectives'],
  ['r_framework', 'Theoretical framework'],
  ['r_method',    'Overall research methodology'],
  ['r_studymeth', 'Study method (scoped to one paper)'],
  ['r_studyres',  'Study results (scoped to one paper)'],
  ['r_studydisc', 'Study discussion (scoped to one paper)'],
  ['r_artefact',  'Artefact / tool development'],
  ['r_eval',      'Evaluation and validation'],
  ['r_synth',     'Cross-study synthesis'],
  ['r_implic',    'Implications and contributions'],
  ['r_limits',    'Limitations'],
  ['r_concl',     'Conclusions'],
  ['r_future',    'Future work'],
  ['r_appendix',  'Appendix']
];
const ROLE_NAME = Object.fromEntries(ROLES);

/* Placement rules, in priority order. Scoped roles win for their own paper. */
const RULES = {
  abstract:     [],
  intro:        ['r_context'],
  litreview:    ['r_lit'],
  gap:          ['r_gap','r_lit'],
  question:     ['r_aims','r_context'],
  framework:    ['r_framework','r_lit'],
  method:       ['r_studymeth','r_method'],
  instrument:   ['r_studymeth','r_method','r_appendix'],
  participants: ['r_studymeth','r_method'],
  analysis:     ['r_studymeth','r_method'],
  results:      ['r_studyres'],
  artefact:     ['r_artefact','r_studyres'],
  evaluation:   ['r_eval','r_studyres'],
  discussion:   ['r_studydisc','r_synth'],
  implications: ['r_implic','r_synth'],
  limitations:  ['r_limits','r_concl'],
  conclusion:   ['r_concl'],
  future:       ['r_future','r_concl'],
  references:   [],
  ack:          [],
  appendix:     ['r_appendix'],
  drop:         []
};

/* ---- IIT Delhi format profile. Editable; these are the defaults ---- */
function iitdFormat(){
  return {
    profileName:'IIT Delhi — PhD thesis (A4 submission copy)',
    pageW:210, pageH:297,
    marginTop:25, marginBottom:25, marginBind:35, marginOuter:25,
    mirror:true,
    bodyFont:'Times New Roman', bodySize:12, lineSpacing:1.5,
    justify:true, indentFirst:true, indentMM:12, paraSpaceAfter:0,
    chapterSize:16, h1Size:14, h2Size:13, h3Size:12,
    chapterCaps:true, headingBold:true,
    captionSize:11, captionSingle:true,
    refSize:12, refSpacing:1.0, refStyle:'APA 7 (author–date)',
    frontNumerals:'roman-lower', bodyNumerals:'arabic',
    numberPosition:'bottom-centre',
    runningHead:false,
    figNumbering:'chapterwise', tblNumbering:'chapterwise',
    abstractWordCap:1000
  };
}

/* ---- default thesis skeleton, shaped for a design-science arc ---- */
function defaultSkeleton(){
  const C=(title,role,brief)=>({id:uid('n'),kind:'chapter',title,role,scope:'',brief:brief||'',blocks:[]});
  const S=(title,role,kind='section')=>({id:uid('n'),kind,title,role,scope:'',brief:'',blocks:[]});
  return [
    C('Introduction','r_context','Why the problem matters, what the thesis sets out to do, how it is organised.'),
      S('Background and motivation','r_context'),
      S('Research gap in brief','r_gap'),
      S('Aim, research questions and objectives','r_aims'),
      S('Research approach at a glance','r_method'),
      S('Structure of the thesis','none'),
    C('Literature review','r_lit','The consolidated review. Every paper\u2019s related-work section lands here.'),
      S('Review scope and method','none'),
      S('State of the art','r_lit'),
      S('Theoretical framing','r_framework'),
      S('Synthesis and research gap','r_gap'),
    C('Research methodology','r_method','The overarching design and how the individual studies fit into it.'),
      S('Research design','r_method'),
      S('Overview of the studies','none'),
      S('Quality, rigour and ethics','none'),
    C('Study 1','none','Scope this chapter to one paper so its method, results and discussion land together.'),
      S('Method','r_studymeth'),
      S('Results','r_studyres'),
      S('Discussion','r_studydisc'),
    C('Study 2','none',''),
      S('Method','r_studymeth'),
      S('Results','r_studyres'),
      S('Discussion','r_studydisc'),
    C('Development of the artefact','r_artefact','Design, architecture and rationale of what you built.'),

const state = {
  meta:{
    title:'', subtitle:'', author:'', entryNo:'', degree:'Doctor of Philosophy',
    dept:'Department of Design', supervisor:'', cosupervisor:'',
    month:'', year:String(new Date().getFullYear()), place:'New Delhi',
    dedication:'', keywords:''
  },
  format: iitdFormat(),
  papers: [],
  skeleton: defaultSkeleton(),
  front:{
    acknowledgement:'', abstract:'', ackSeeds:{supervisor:'',src:'',lab:'',funding:'',family:'',others:''},
    includeDedication:false, includeAbbrev:true, includeSymbols:false, includePubs:true, includeBiodata:true

  abbrev:[], figures:[], tables:[], refs:[], recastLog:[],
  ai:{key:'', enabled:true, lastError:''},

/* =====================================================================
   1. TEXT INTAKE AND SEGMENTATION
   ===================================================================== */

const HEAD_HINTS = [
  [/^\s*(abstract|summary)\w*/i,'abstract'],
  [/^\s*keywords?\b/i,'drop'],
  [/^\s*(\d+[.)]?\s*)?(introduction|background and motivation)\w*/i,'intro'],
  [/\b(literature|related work|prior work|state of the art|background|review of)\w*/i,'litreview'],
  [/\b(research gap|gap in|gaps in|need for|problem statement)\w*/i,'gap'],
  [/\b(research question|aim|objective|scope of the)\w*/i,'question'],
  [/\b(theoretical|conceptual framework|framework)\w*/i,'framework'],
  [/\b(method|methodolog|study design|research design|research approach|procedure)\w*/i,'method'],
  [/\b(instrument|questionnaire|protocol|material|apparatus|stimul)\w*/i,'instrument'],
  [/\b(participant|sample|respondent|recruit|interviewee)\w*/i,'participants'],
  [/\b(data analysis|analysis procedure|analytic|coding scheme|statistical|thematic analysis)\w*/i,'analysis'],
  [/\b(result|finding|observation)s?\b/i,'results'],
  [/\b(tool|artefact|artifact|prototype|implementation|architecture|system design|development of)\w*/i,'artefact'],
  [/\b(evaluat|validat|usability|user test|pilot stud|verification)\w*/i,'evaluation'],
  [/\b(discussion|interpretation|discussing)\w*/i,'discussion'],
  [/\b(implication|contribution)\w*/i,'implications'],
  [/\b(limitation|threats to validity|shortcoming)\w*/i,'limitations'],
  [/\b(conclusion|concluding|closing remark)\w*/i,'conclusion'],
  [/\b(future work|further research|future direction|further work)\w*/i,'future'],
  [/\b(reference|bibliograph|works cited|literature cited)\w*/i,'references'],
  [/\b(acknowledg)\w*/i,'ack'],
  [/\b(appendix|appendice|supplementary)\w*/i,'appendix'],
  [/\b(declaration|funding statement|conflict of interest|ethics statement|author contribution|data availability|competing interest)\w*/i,'drop']
];

function looksLikeHeading(line){
  const t = line.trim();
  if(!t || t.length > 110) return false;
  if(/[.;,]$/.test(t) && !/^\d+(\.\d+)*\.?$/.test(t)) return false;
  if(/^\s*\d+(\.\d+)*\.?\s+\S/.test(t)) return true;            // 3.2 Something
  if(/^[A-Z][A-Za-z0-9 ,\-:'&()\/]{2,}$/.test(t) && words(t) <= 12){
    if(t === t.toUpperCase()) return true;                       // ALL CAPS
    const caps = t.split(/\s+/).filter(w=>/^[A-Z]/.test(w)).length;
    if(caps / Math.max(1,words(t)) > .45) return true;            // Title Case
  }
  if(HEAD_HINTS.some(([re])=>re.test(t)) && words(t) <= 9) return true;
  return false;
}

function classify(heading, body){
  const probe = (heading||'') + ' \n ' + (body||'').slice(0,220);
  for(const [re,lab] of HEAD_HINTS){ if(re.test(heading||'')) return lab; }
  for(const [re,lab] of HEAD_HINTS){ if(re.test(probe)) return lab; }
  return 'litreview';
}

function cleanRaw(txt){
  return String(txt||'')
    .replace(/\r/g,'')
    .replace(/\u00ad/g,'')
    .replace(/-\n(?=[a-z])/g,'')                 // de-hyphenate line breaks
    .replace(/([^\n.!?:;])\n(?=[a-z(])/g,'$1 ')  // unwrap soft-wrapped lines
    .replace(/\n{3,}/g,'\n\n')
    .replace(/[ \t]{2,}/g,' ');
}

function segmentText(raw){
  const txt = cleanRaw(raw);
  const lines = txt.split('\n');
  const segs = [];
  let cur = {heading:'(opening)', lines:[]};
  for(const ln of lines){
    if(looksLikeHeading(ln)){
      if(cur.lines.join('').trim() || cur.heading!=='(opening)') segs.push(cur);
      cur = {heading:ln.trim(), lines:[]};
    } else cur.lines.push(ln);
  }
  segs.push(cur);
  return segs
    .map(s=>({heading:s.heading, text:s.lines.join('\n').trim()}))
    .filter(s=>s.text || /reference|appendix/i.test(s.heading))
    .map(s=>({
      id:uid('s'), heading:s.heading, text:s.text,
      label:classify(s.heading,s.text), wc:words(s.text), placedIn:null, order:0
    }));
}

/* Fallback for text with no detectable headings: split on paragraph clusters */
function segmentFallback(raw){
  const paras = cleanRaw(raw).split(/\n{2,}/).filter(p=>p.trim());
  const chunk = Math.max(1, Math.ceil(paras.length/8));
  const out=[];
  for(let i=0;i<paras.length;i+=chunk){
    const text = paras.slice(i,i+chunk).join('\n\n');
    out.push({id:uid('s'), heading:'Untitled block '+(out.length+1), text,
      label:classify('',text), wc:words(text), placedIn:null, order:0});
  }
  return out;
}

function addPaper(name, raw){
  const idx = state.papers.length;
  let segs = segmentText(raw);
  if(segs.length < 3) segs = segmentFallback(raw);
  const guessTitle = (cleanRaw(raw).split('\n').find(l=>l.trim().length>18) || name).trim().slice(0,180);
  const p = {
    id: uid('p'), code:'P'+(idx+1), color: INK[idx % INK.length],
    title: guessTitle, venue:'', year:'', authors:'', type:'Journal article',
    filename:name, raw: cleanRaw(raw), segments: segs
  };
  state.papers.push(p);
  extractFiguresTables(p);
  harvestRefs(p);
  return p;
}

/* =====================================================================
   2. FIGURES, TABLES, ABBREVIATIONS
   ===================================================================== */

function extractFiguresTables(p){
  const capRe = /^\s*(fig(?:ure)?\.?|table)\s*([0-9]+[a-z]?)\s*[.:\u2013-]?\s+(.{4,240})$/gim;
  const seen = new Set();
  let m;
  while((m = capRe.exec(p.raw))){
    const kind = /^t/i.test(m[1]) ? 'table' : 'figure';
    const key = kind + m[2];
    if(seen.has(key)) continue;
    seen.add(key);
    const rec = {id:uid('c'), paperId:p.id, kind, origNo:m[2],
      caption:m[3].replace(/\s+/g,' ').trim().replace(/[.;]$/,''), newNo:''};
    (kind==='figure'?state.figures:state.tables).push(rec);
  }
}

function detectAbbrev(){
  const map = new Map();
  const body = allPlacedText();
  const re = /\b([A-Z][A-Za-z\-]*(?:\s+(?:of|for|and|the|in|on|[A-Z][A-Za-z\-]*)){1,6})\s*\((([A-Z]{2,7})(?:s)?)\)/g;
  let m;
  while((m = re.exec(body))){
    const full = m[1].replace(/\s+/g,' ').trim();
    const ab = m[3];
    if(!map.has(ab)) map.set(ab, full);
  }
  const existing = new Set(state.abbrev.map(a=>a.short));
  for(const [short,long] of map){
    if(!existing.has(short)) state.abbrev.push({id:uid('a'), short, long});
  }
  state.abbrev.sort((a,b)=>a.short.localeCompare(b.short));
}

/* Renumber figures/tables chapter-wise in order of first appearance */
function renumberCaptions(){
  const order = [];
  state.skeleton.forEach(n=>{
    const ch = chapterOf(n);
    n.blocks.forEach(b=>{
      const s = segById(b.segId); if(!s) return;
      order.push({chapterNo: ch, paperId: paperOfSeg(s.id)?.id, text:s.text});
    });
  });
  const counters = {};
  const assign = (list, kind) => {
    list.forEach(c=>c.newNo='');
    order.forEach(item=>{
      const chNo = item.chapterNo || 1;
      const re = new RegExp('\\b(' + (kind==='figure'?'fig(?:ure)?':'table') + ')\\.?\\s*([0-9]+[a-z]?)\\b','gi');
      let m;
      while((m = re.exec(item.text))){
        const rec = list.find(c=>c.paperId===item.paperId && c.origNo.toLowerCase()===m[2].toLowerCase());
        if(rec && !rec.newNo){
          counters[kind+chNo] = (counters[kind+chNo]||0)+1;
          rec.newNo = chNo + '.' + counters[kind+chNo];
          rec.chapterNo = chNo;
        }
      }
    });
  };
  assign(state.figures,'figure');
  assign(state.tables,'table');
}

function rewriteCaptionRefs(text, paperId, chapterNo){
  let out = text;
  const swap = (list, word) => {
    list.filter(c=>c.paperId===paperId && c.newNo).forEach(c=>{
      const re = new RegExp('\\b(' + word + ')\\.?\\s*' + c.origNo.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','gi');
      out = out.replace(re, (mm, w) => (/^t/i.test(w) ? 'Table ' : 'Figure ') + c.newNo);
    });
  };
  swap(state.figures,'fig(?:ure)?');
  swap(state.tables,'table');
  return out;
}

/* =====================================================================
   3. REFERENCES — harvest, merge, de-duplicate
   ===================================================================== */

function splitRefBlock(txt){
  let t = txt.replace(/\r/g,'');
  if(/^\s*\[\d+\]/m.test(t)) return t.split(/\n(?=\s*\[\d+\])/).map(s=>s.trim()).filter(Boolean);
  if(/^\s*\d+\.\s+[A-Z]/m.test(t)) return t.split(/\n(?=\s*\d+\.\s+[A-Z])/).map(s=>s.trim()).filter(Boolean);
  if(/\n\s*\n/.test(t)) return t.split(/\n\s*\n/).map(s=>s.replace(/\n/g,' ').trim()).filter(Boolean);
  return t.split(/\n(?=[A-ZÀ-Ý][A-Za-zÀ-ÿ'’\-]+,\s*[A-Z])/).map(s=>s.replace(/\n/g,' ').trim()).filter(s=>words(s)>4);
}

function refKey(raw){
  const yr = (raw.match(/\((\d{4}[a-z]?)\)/) || raw.match(/\b(19|20)\d{2}\b/) || [,''])[1] || '';
  const auth = (raw.match(/^[\[\d\].\s]*([A-ZÀ-Ý][A-Za-zÀ-ÿ'’\-]{1,})/) || [,''])[1] || '';
  const title = (raw.replace(/^[^)]*\)\s*/,'').match(/[A-Za-z][A-Za-z0-9\- ]{12,}/) || [''])[0];
  const tkey = title.toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).slice(0,5).join(' ');
  return (auth+'|'+yr+'|'+tkey).toLowerCase();
}

function harvestRefs(p){
  const seg = p.segments.find(s=>s.label==='references');
  if(!seg) return;
  splitRefBlock(seg.text).forEach(raw=>{
    const clean = raw.replace(/^\s*(\[\d+\]|\d+\.)\s*/,'').replace(/\s+/g,' ').trim();
    if(words(clean) < 5) return;
    const k = refKey(clean);
    const hit = state.refs.find(r=>r.key===k);
    if(hit){ if(!hit.from.includes(p.id)) hit.from.push(p.id); if(clean.length>hit.raw.length) hit.raw=clean; }
    else state.refs.push({id:uid('r'), key:k, raw:clean, from:[p.id], keep:true});
  });
  sortRefs();
}
function sortRefs(){ state.refs.sort((a,b)=>a.raw.localeCompare(b.raw,'en',{sensitivity:'base'})); }

/* =====================================================================
   4. PLACEMENT ENGINE
   ===================================================================== */

const flat = () => state.skeleton;
const segById = id => { for(const p of state.papers){ const s=p.segments.find(x=>x.id===id); if(s) return s; } return null; };
const paperOfSeg = id => state.papers.find(p=>p.segments.some(s=>s.id===id));
const nodeById = id => state.skeleton.find(n=>n.id===id);

function chapterOf(node){
  let n = 0;
  for(const x of state.skeleton){ if(x.kind==='chapter') n++; if(x.id===node.id) return n; }
  return n;
}
function numberOf(node){
  let ch=0, sec=0, sub=0;
  for(const x of state.skeleton){
    if(x.kind==='chapter'){ ch++; sec=0; sub=0; if(x.id===node.id) return String(ch); }
    else if(x.kind==='section'){ sec++; sub=0; if(x.id===node.id) return ch+'.'+sec; }
    else { sub++; if(x.id===node.id) return ch+'.'+sec+'.'+sub; }
  }
  return '';
}

function placeSeg(segId, nodeId){
  const s = segById(segId); if(!s) return;
  unplaceSeg(segId);
  const n = nodeById(nodeId); if(!n) return;
  n.blocks.push({segId, kind:'segment'});
  s.placedIn = nodeId;
}
function unplaceSeg(segId){
  state.skeleton.forEach(n=>{ n.blocks = n.blocks.filter(b=>b.segId!==segId); });
  const s = segById(segId); if(s) s.placedIn = null;
}

function autoPlace(onlyUnplaced=true){
  let placed=0, skipped=0;
  state.papers.forEach(p=>{
    p.segments.forEach(s=>{
      if(onlyUnplaced && s.placedIn) return;
      if(HELD.includes(s.label)){ skipped++; return; }
      const chain = RULES[s.label] || [];
      const depth = n => n.kind==='subsection'?0 : n.kind==='section'?1 : 2;
      const best = list => list.sort((a,b)=>depth(a)-depth(b))[0];
      let target = null;
      for(const role of chain){
        const scoped = state.skeleton.filter(n=>n.role===role && n.scope===p.id);
        if(scoped.length){ target = best(scoped); break; }
        const open = state.skeleton.filter(n=>n.role===role && !n.scope);
        if(open.length){ target = best(open); break; }
      }
      if(target){ placeSeg(s.id, target.id); placed++; } else skipped++;
    });
  });
  renumberCaptions();
  return {placed, skipped};
}

function allPlacedText(){
  let out=[];
  state.skeleton.forEach(n=>n.blocks.forEach(b=>{
    const s=segById(b.segId); if(s) out.push(s.text);
  }));
  return out.join('\n\n');
}
const HELD = ['references','drop','ack','abstract'];
function totalWords(){ return state.papers.reduce((a,p)=>a+p.segments.reduce((x,s)=>x+(HELD.includes(s.label)?0:s.wc),0),0); }
function placedWords(){ let t=0; state.skeleton.forEach(n=>n.blocks.forEach(b=>{const s=segById(b.segId); if(s)t+=s.wc;})); return t; }

function spineFor(node){
  const by = {}; let tot=0;
  node.blocks.forEach(b=>{
    const s=segById(b.segId); if(!s) return;
    const p=paperOfSeg(s.id); if(!p) return;
    by[p.id]=(by[p.id]||0)+s.wc; tot+=s.wc;
  });
  if(!tot) return '';
  return Object.entries(by).map(([pid,w])=>{
    const p=state.papers.find(x=>x.id===pid);
    return `<i style="width:${(w/tot*100).toFixed(1)}%;background:${p?p.color:'#999'}" title="${esc(p?p.code:'?')} · ${w} words"></i>`;
  }).join('');
}

/* =====================================================================
   5. PROOF CHECKS — overlap, paper-voice, cross-references, compliance
   ===================================================================== */

const STOP = new Set('the a an of and or to in for on with that this these those is are was were be been by as at from it its their our we i he she they not but if than then such can may might will would should could has have had do does did into over under between within across also more most other some any each per'.split(' '));

function shingles(txt, n=6){
  const w = (txt.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(x=>!STOP.has(x));
  const set = new Set();
  for(let i=0;i+n<=w.length;i++) set.add(w.slice(i,i+n).join(' '));
  return set;
}
function jaccard(a,b){
  if(!a.size||!b.size) return 0;
  let inter=0; for(const x of a) if(b.has(x)) inter++;
  return inter/(a.size+b.size-inter);
}

function findOverlaps(threshold=0.16){
  const units=[];
  state.skeleton.forEach(n=>n.blocks.forEach(b=>{
    const s=segById(b.segId); if(!s) return;
    const p=paperOfSeg(s.id);
    s.text.split(/\n{2,}/).forEach((para,i)=>{
      if(words(para) < 45) return;
      units.push({node:n, seg:s, paper:p, i, text:para, sh:shingles(para)});
    });
  }));
  const hits=[];
  for(let a=0;a<units.length;a++){
    for(let b=a+1;b<units.length;b++){
      if(units[a].paper && units[b].paper && units[a].paper.id===units[b].paper.id && units[a].seg.id===units[b].seg.id) continue;
      const j = jaccard(units[a].sh, units[b].sh);
      if(j >= threshold) hits.push({a:units[a], b:units[b], j});
    }
  }
  return hits.sort((x,y)=>y.j-x.j).slice(0,60);
}

/* Voice recasting: paper language -> thesis language */
const RECASTS = [
  [/\bin this paper\b/gi, 'in this chapter', 'Paper self-reference'],
  [/\bthis paper (presents|reports|describes|proposes|examines|explores|investigates|introduces)\b/gi, 'this chapter $1', 'Paper self-reference'],
  [/\bthe present paper\b/gi, 'this chapter', 'Paper self-reference'],
  [/\bthis (article|manuscript|contribution)\b/gi, 'this chapter', 'Paper self-reference'],
  [/\bthe (paper|article) is organi[sz]ed as follows\b/gi, 'the chapter is organised as follows', 'Paper self-reference'],
  [/\bin the remainder of (this|the) paper\b/gi, 'in the remainder of this chapter', 'Paper self-reference'],
  [/\bour (study|work|research|findings|results|analysis|approach|method)\b/gi, 'this $1', 'Plural authorial voice'],
  [/\bwe (present|report|describe|propose|examine|explore|investigate|argue|conducted|carried out|developed|found|observed|conclude)\b/gi, 'I $1', 'Plural authorial voice'],
  [/\bthe authors\b/gi, 'the researcher', 'Plural authorial voice'],
  [/\bin the previous section\b/gi, 'earlier in this chapter', 'Broken cross-reference'],
  [/\bsee (Section|Sec\.)\s*\d+(\.\d+)*/gi, '[cross-reference to update]', 'Broken cross-reference'],
  [/\b(Section|Sec\.)\s*\d+(\.\d+)*\s+(above|below)\b/gi, '[cross-reference to update]', 'Broken cross-reference'],
  [/\bfor space reasons\b/gi, '', 'Journal-only phrasing'],
  [/\bdue to (the )?(page|space) (limit|constraint)\w*/gi, '', 'Journal-only phrasing'],
  [/\bin the supplementary (material|file)\w*/gi, 'in the appendices', 'Journal-only phrasing'],
  [/\bthis special issue\b/gi, 'this body of work', 'Journal-only phrasing']
];

function scanRecast(){
  const found=[];
  state.skeleton.forEach(n=>n.blocks.forEach(b=>{
    const s=segById(b.segId); if(!s) return;
    RECASTS.forEach(([re,rep,cat],ri)=>{
      const rx = new RegExp(re.source, re.flags);
      let m;
      while((m = rx.exec(s.text))){
        found.push({segId:s.id, nodeId:n.id, ri, cat, match:m[0], idx:m.index,
          ctx:s.text.slice(Math.max(0,m.index-70), m.index+m[0].length+70)});
        if(!re.global) break;
      }
    });
  }));
  return found;
}
function applyRecast(categories){
  let count=0;
  state.papers.forEach(p=>p.segments.forEach(s=>{
    if(!s.placedIn) return;
    RECASTS.forEach(([re,rep,cat])=>{
      if(!categories.includes(cat)) return;
      const rx = new RegExp(re.source, re.flags);
      count += (s.text.match(rx)||[]).length;
      s.text = s.text.replace(rx, rep);
    });
    s.wc = words(s.text);
  }));
  state.recastLog.push({when:new Date().toISOString(), categories, count});
  return count;
}

function complianceChecks(){
  const f = state.format, m = state.meta, out = [];
  const add=(ok,txt,note)=>out.push({ok,txt,note});
  add(!!m.title,'Thesis title set','Appears on the title page, the spine and the certificate.');
  add(!!m.author,'Candidate name set','');
  add(!!m.entryNo,'Entry number set','IIT Delhi title pages carry the entry number.');
  add(!!m.supervisor,'Supervisor named','Needed for the certificate page.');
  add(!!m.dept,'Department named','');
  add(!!m.month && !!m.year,'Month and year of submission set','');
  add(f.bodyFont.toLowerCase().includes('times')||f.bodyFont.toLowerCase().includes('arial'),'Body typeface is a standard serif/sans','Times New Roman is the safe default.');
  add(f.bodySize>=11 && f.bodySize<=12,'Body size within 11–12 pt','');
  add(f.lineSpacing>=1.5,'Line spacing at least 1.5','');
  add(f.marginBind>=30,'Binding margin at least 30 mm','Left margin on single-sided; inner margin on double-sided.');
  add(f.marginTop>=20 && f.marginOuter>=20,'Other margins at least 20 mm','');
  add(f.frontNumerals!=='none','Front matter uses roman numerals','');
  add(state.front.abstract.trim().length>0,'Abstract written','');
  add(words(state.front.abstract)<=f.abstractWordCap,'Abstract within word cap','Cap is '+f.abstractWordCap+' words; currently '+words(state.front.abstract)+'.');
  add(state.front.acknowledgement.trim().length>0,'Acknowledgement written','');
  add(state.refs.filter(r=>r.keep).length>0,'Reference list present','');
  add(state.skeleton.filter(n=>n.kind==='chapter').length>=4,'At least four chapters','A doctoral thesis normally runs from Introduction to Conclusions.');
  const empty = state.skeleton.filter(n=>n.kind==='chapter' && !chapterHasContent(n));
  add(empty.length===0, 'Every chapter has material', empty.length? 'Empty: '+empty.map(n=>n.title).join(', ') : '');
  const unplaced = state.papers.flatMap(p=>p.segments.filter(s=>!s.placedIn && !HELD.includes(s.label)));
  add(unplaced.length===0,'All carried-over segments placed', unplaced.length? unplaced.length+' segment(s) still unplaced.' : '');
  add(state.papers.every(p=>p.venue && p.year),'Every paper has venue and year','Needed for the List of Publications.');
  return out;
}
function chapterHasContent(chap){
  const idx = state.skeleton.indexOf(chap);
  let has = chap.blocks.length>0 || (chap.brief||'').trim().length>0;
  for(let i=idx+1;i<state.skeleton.length;i++){
    if(state.skeleton[i].kind==='chapter') break;
    if(state.skeleton[i].blocks.length) has = true;
  }
  return has;
}

   6. AI ASSIST (optional). Works inside Claude; needs a key if self-hosted.

async function ask(prompt, system){
  const headers = {'Content-Type':'application/json'};
  if(state.ai.key){ headers['x-api-key']=state.ai.key; headers['anthropic-version']='2023-06-01'; headers['anthropic-dangerous-direct-browser-access']='true'; }
  const body = {model:'claude-sonnet-4-6', max_tokens:1000, messages:[{role:'user',content:prompt}]};
  if(system) body.system = system;
  const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify(body)});
  if(!res.ok) throw new Error('Assist request failed ('+res.status+')');
  const data = await res.json();
  return (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
}
async function assist(prompt, system){
  try{ state.ai.lastError=''; return await ask(prompt, system); }
  catch(e){
    state.ai.lastError = e.message;
    toast('Writing assist is not reachable here. Everything else still works.');
    return null;
  }
}

const ROMAN = n => {
  const t=[[1000,'m'],[900,'cm'],[500,'d'],[400,'cd'],[100,'c'],[90,'xc'],[50,'l'],[40,'xl'],[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']];
  let out=''; for(const [v,s] of t){ while(n>=v){ out+=s; n-=v; } } return out;
};
const M = k => state.meta[k] || '';
const SUP = () => [M('supervisor'), M('cosupervisor')].filter(Boolean);

function genCertificate(){
  const sups = SUP();
  const plural = sups.length>1;
  return `This is to certify that the thesis entitled “${M('title')}”, being submitted by ${M('author')} (${M('entryNo')}) to the ${M('dept')}, Indian Institute of Technology Delhi, for the award of the degree of ${M('degree')}, is a record of bona fide research work carried out by ${'him/her'} under ${plural?'our':'my'} supervision and guidance.

The candidate has fulfilled the requirements for the submission of this thesis, which to the best of ${plural?'our':'my'} knowledge has reached the requisite standard. The material contained in this thesis has not been submitted, in part or in full, to any other university or institute for the award of any degree or diploma.

${sups.map(s=>s+'\n'+M('dept')+'\nIndian Institute of Technology Delhi').join('\n\n') || '(supervisor name)'}`;
}

function genDeclaration(){
  return `I declare that this written submission represents my own ideas in my own words. Where the ideas or words of others have been included, I have adequately cited and referenced the original sources. I also declare that I have adhered to all principles of academic honesty and integrity and have not misrepresented, fabricated or falsified any idea, data, fact or source in my submission.

Parts of the work reported in this thesis have appeared in the publications listed under “List of Publications”. These are reproduced here with the necessary permissions, and the contributions of co-authors are acknowledged.

${M('author')}
${M('entryNo')}
${M('place')}`;
}

function genAcknowledgement(){
  const s = state.front.ackSeeds;
  const lines = [];
  if(s.supervisor) lines.push(`I owe my deepest gratitude to my supervisor, ${s.supervisor}, whose guidance shaped this work from its first uncertain question to its present form. The patience with which each draft was read, and the precision of the questions asked of it, have marked both this thesis and the way I now think about research.`);
  if(s.src) lines.push(`I thank the members of my Student Research Committee, ${s.src}, for the care with which they examined this work at each stage and for the corrections that have made it stronger.`);
  if(s.lab) lines.push(`My thanks go to ${s.lab}, whose company through long days of coding, piloting and analysis made the work lighter than it had any right to be.`);
  if(s.funding) lines.push(`I gratefully acknowledge ${s.funding} for supporting this research.`);
  lines.push(`I am grateful to every participant who gave time to the studies reported here. Their willingness to describe how they actually work, rather than how they are supposed to, is the substance of this thesis.`);
  if(s.others) lines.push(s.others);
  if(s.family) lines.push(`Finally, to ${s.family} — for a patience I did not earn and could not have done without.`);
  lines.push(`\n${M('author')}`);
  return lines.join('\n\n');
}

function genPublications(){
  const j = state.papers.filter(p=>/journal/i.test(p.type));
  const c = state.papers.filter(p=>!/journal/i.test(p.type));
  const fmt = (p,i) => `[${i+1}] ${p.authors||M('author')} (${p.year||'n.d.'}). ${p.title}. ${p.venue||''}`.replace(/\s+\./g,'.').trim();
  const out = [];
  if(j.length){ out.push('Journal papers'); j.forEach((p,i)=>out.push(fmt(p,i))); }
  if(c.length){ out.push('Conference papers'); c.forEach((p,i)=>out.push(fmt(p,i))); }
  return out.join('\n');
}

function chapterMap(){
  const rows = [];
  state.papers.forEach(p=>{
    const chs = new Set();
    state.skeleton.forEach(n=>n.blocks.forEach(b=>{
      const s=segById(b.segId); if(s && paperOfSeg(s.id)?.id===p.id) chs.add(chapterOf(n));
    }));
    rows.push({p, chapters:[...chs].sort((a,b)=>a-b)});
  });
  return rows;
}

function paras(text, cls){
  return text.split(/\n{2,}/).map(p=>p.trim()).filter(Boolean)
    .map(p=>`<p${cls?' class="'+cls+'"':''}>${esc(p).replace(/\n/g,' ')}</p>`).join('\n');
}

function tocRows(){
  const front=['Certificate','Declaration','Acknowledgement','Abstract','List of Figures','List of Tables','List of Abbreviations'];
  let rows = front.map(t=>`<tr><td class="n"></td><td>${t}</td><td class="pg">${'&nbsp;'}</td></tr>`).join('');
  state.skeleton.forEach(n=>{
    const no = numberOf(n);
    const bold = n.kind==='chapter';
    rows += `<tr><td class="n">${bold?'<b>Chapter '+no+'</b>':no}</td><td>${bold?'<b>'+esc(n.title)+'</b>':(n.kind==='subsection'?'&nbsp;&nbsp;&nbsp;':'')+esc(n.title)}</td><td class="pg"></td></tr>`;
  });
  rows += `<tr><td class="n"></td><td><b>References</b></td><td class="pg"></td></tr>`;
  if(state.front.includePubs) rows += `<tr><td class="n"></td><td><b>List of Publications</b></td><td class="pg"></td></tr>`;
  if(state.front.includeBiodata) rows += `<tr><td class="n"></td><td><b>Brief Bio-data of the Author</b></td><td class="pg"></td></tr>`;
  return rows;
}
function capRows(list,word){
  return list.filter(c=>c.newNo).sort((a,b)=>a.newNo.localeCompare(b.newNo,'en',{numeric:true}))
    .map(c=>`<tr><td class="n">${word} ${c.newNo}</td><td>${esc(c.caption)}</td><td class="pg"></td></tr>`).join('');
}

function buildBody(){
  let out='';
  state.skeleton.forEach(n=>{
    const no = numberOf(n);
    const chNo = chapterOf(n);
    if(n.kind==='chapter') out += `<h1 class="chap"><span class="no">Chapter ${no}</span>${esc(n.title)}</h1>`;
    else if(n.kind==='section') out += `<h2 class="sec">${no}&nbsp;&nbsp;${esc(n.title)}</h2>`;
    else out += `<h3 class="sub">${no}&nbsp;&nbsp;${esc(n.title)}</h3>`;
    if(n.brief && !n.blocks.length) out += `<p class="noind"><i>[${esc(n.brief)}]</i></p>`;
    n.blocks.forEach(b=>{
      if(b.kind==='bridge'){ out += paras(b.text||'','noind'); return; }
      const s = segById(b.segId); if(!s) return;
      const p = paperOfSeg(s.id);
      let t = rewriteCaptionRefs(s.text, p?p.id:'', chNo);
      out += paras(t);
    });
  });
  out += `<h1 class="chap">References</h1><div class="refs">` +
    state.refs.filter(r=>r.keep).map(r=>`<p>${esc(r.raw)}</p>`).join('') + `</div>`;
  if(state.front.includePubs) out += `<h1 class="chap">List of Publications</h1>${paras(genPublications(),'noind')}`;
  if(state.front.includeBiodata) out += `<h1 class="chap">Brief Bio-data of the Author</h1>${paras(state.front.biodata||`${M('author')} received a bachelor's degree in engineering and a master's degree in design before joining the ${M('dept')}, Indian Institute of Technology Delhi, as a doctoral candidate. The research reported in this thesis was carried out under the supervision of ${SUP().join(' and ')||'(supervisor)'}.`,'noind')}`;
  return out;
}

function buildDocument(forWord){
  return `<div class="front-matter">${buildFrontMatter()}</div>\n<div class="body-matter">${buildBody()}</div>`;
}

  const b = new Blob([text], {type: mime||'text/plain;charset=utf-8'});

  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 400);
}

async function readAnyFile(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(['txt','md','markdown','tex','csv'].includes(ext)) return await file.text();
  if(ext==='html'||ext==='htm'){
    const d = new DOMParser().parseFromString(await file.text(),'text/html');
    return d.body.innerText;
  }
  if(ext==='docx'){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    const buf = await file.arrayBuffer();
    const r = await window.mammoth.extractRawText({arrayBuffer:buf});
    return r.value;
  }
  if(ext==='pdf'){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc = await window.pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
    let out=[];
    for(let i=1;i<=doc.numPages;i++){
      const pg = await doc.getPage(i);
      const tc = await pg.getTextContent();
      let line='', last=null, buf=[];
      tc.items.forEach(it=>{
        const y = it.transform[5];
        if(last!==null && Math.abs(y-last)>3){ buf.push(line.trim()); line=''; }
        line += it.str + (it.hasEOL?'':' ');
        last = y;
      });
      buf.push(line.trim());
      out.push(buf.filter(Boolean).join('\n'));
    }
    return out.join('\n\n');
  }
  return await file.text();
}
const _scripts = {};
function loadScript(src){
  if(_scripts[src]) return _scripts[src];
  _scripts[src] = new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src;
    s.onload=res; s.onerror=()=>rej(new Error('Could not load the reader for this file type. Paste the text instead.'));
    document.head.appendChild(s);
  });
  return _scripts[src];
}

let _t;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(_t); _t=setTimeout(()=>el.classList.remove('on'), 3600);
}
function bind(sel, ev, fn, root=document){ $$(sel,root).forEach(el=>el.addEventListener(ev,fn)); }
function fieldBind(root){
  $$('[data-model]',root).forEach(el=>{
    const path = el.dataset.model.split('.');
    let o = state; for(let i=0;i<path.length-1;i++) o=o[path[i]];
    const k = path[path.length-1];
    if(el.type==='checkbox') el.checked = !!o[k]; else el.value = o[k] ?? '';
    el.addEventListener('input', ()=>{
      o[k] = el.type==='checkbox' ? el.checked : (el.type==='number' ? parseFloat(el.value)||0 : el.value);
      if(el.dataset.live) render(); else updateChrome();
    });
  });
}
function updateChrome(){
  $('#mastTitle').innerHTML = M('title') ? esc(M('title')) : 'SynThesis <span>— untitled thesis</span>';
  $('#mastSub').textContent = M('author') ? `${M('author')}${M('entryNo')?' · '+M('entryNo'):''} · ${M('dept')}` : 'Add your papers, lay out the chapters, and let the pieces fall where they belong.';
  const tot = totalWords(), pl = placedWords();
  const pct = tot? Math.round(pl/tot*100) : 0;
  $('#gaugeFill').style.width = pct+'%';
  $('#gaugeTxt').textContent = tot ? `${pct}% set · ${pl.toLocaleString()} of ${tot.toLocaleString()} words` : 'nothing set';
  $('#tagPapers').textContent = state.papers.length;
  $('#tagSegs').textContent = state.papers.reduce((a,p)=>a+p.segments.length,0);
  $('#tagNodes').textContent = state.skeleton.filter(n=>n.kind==='chapter').length;
  const un = state.papers.flatMap(p=>p.segments.filter(s=>!s.placedIn && !HELD.includes(s.label))).length;
  $('#tagUnplaced').textContent = un ? un+' left' : (state.papers.length?'clear':'—');
  $('#tagRefs').textContent = state.refs.filter(r=>r.keep).length;
}

VIEWS.papers = () => `
<div class="stage-head"><h2>Papers</h2>
<p>Add each published paper. PDF, Word, text and Markdown are read in the browser; you can also paste. Every paper gets a colour, and that colour follows its material all the way to the finished chapter.</p></div>
<div class="panel">
  <div class="row">
    <button class="btn key" id="btnPick">Add paper files</button>
    <input type="file" id="filePapers" multiple accept=".pdf,.docx,.txt,.md,.html,.tex" hidden>
    <button class="btn ghost" id="btnPaste">Paste text instead</button>
    <div class="spacer"></div>
    <span class="tiny mut">${state.papers.length} paper${state.papers.length===1?'':'s'} · ${totalWords().toLocaleString()} carry-over words</span>
  </div>

    <label class="f"><span>Paper title or filename</span><input type="text" id="pasteName" placeholder="Study 2 — needs elicitation with educators"></label>

</div>
${state.papers.length ? state.papers.map(p=>`
<div class="paper-card">
  <div class="paper-band" style="background:${p.color}"></div>
  <div class="paper-body">
    <div class="row" style="align-items:flex-start">
      <div style="flex:1;min-width:0">

        <p class="tiny mut" style="margin:3px 0 0">${p.code} · ${p.segments.length} segments · ${p.segments.reduce((a,s)=>a+s.wc,0).toLocaleString()} words · ${esc(p.filename)}</p>
      </div>
      <button class="btn ghost sm" data-resplit="${p.id}">Re-split</button>
      <button class="btn danger sm" data-delpaper="${p.id}">Remove</button>
    </div>
    <div class="grid g3" style="margin-top:10px">

      <label class="f"><span>Type</span><select data-paper="${p.id}" data-key="type">${['Journal article','Conference paper','Book chapter','Under review'].map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></label>

VIEWS.segments = () => {
  if(!state.papers.length) return `<div class="stage-head"><h2>Segments</h2></div><div class="empty"><strong>Add a paper first</strong>Segments appear once there is something to split.</div>`;
  const counts = {};
  state.papers.forEach(p=>p.segments.forEach(s=>counts[s.label]=(counts[s.label]||0)+1));
  return `
<div class="stage-head"><h2>Segments</h2>
<p>What each part of each paper is. The splitter has made a first pass; correct anything it got wrong, because these labels are what decide where the text lands.</p></div>
<div class="panel">
  <h3>Across all papers</h3>
  <div class="row">${LABELS.filter(([k])=>counts[k]).map(([k,n])=>`<span class="chip">${esc(n)} · ${counts[k]}</span>`).join('')}</div>
  <div class="row" style="margin-top:10px">
    <button class="btn ghost sm" id="btnAiSeg">Re-label with writing assist</button>
    <span class="tiny mut">Useful when a paper has unusual section names.</span>
  </div>
</div>
${state.papers.map(p=>`
<div class="paper-card">
  <div class="paper-band" style="background:${p.color}"></div>
  <div class="paper-body">
    <h4>${p.code} — ${esc(p.title)}</h4>
    <div class="seglist">
      ${p.segments.map(s=>`
      <div class="segrow">
        <select data-seglabel="${s.id}">${LABELS.map(([k,n])=>`<option value="${k}" ${s.label===k?'selected':''}>${esc(n)}</option>`).join('')}</select>
        <span class="seg-h" title="${esc(s.heading)}">${esc(s.heading)}</span>
        <span class="chip">${s.wc}w</span>
        ${s.placedIn?`<span class="chip g">set</span>`:`<span class="chip">loose</span>`}
        <button class="btn ghost sm" data-viewseg="${s.id}">Read</button>
      </div>`).join('')}
    </div>
  </div>
</div>`).join('')}
<div id="segReader"></div>`;
};

VIEWS.skeleton = () => `
<div class="stage-head"><h2>Chapters</h2>
<p>The shape of the thesis, and what each slot is <em>for</em>. That purpose is how material finds its way here: a slot marked “Literature review” takes the related-work sections of every paper. A slot scoped to one paper takes only that paper's material.</p></div>
<div class="panel">
  <div class="row">
    <button class="btn ghost sm" data-add="chapter">Add chapter</button>
    <button class="btn ghost sm" data-add="section">Add section</button>
    <button class="btn ghost sm" data-add="subsection">Add subsection</button>
    <div class="spacer"></div>
    <span class="tiny mut">${state.skeleton.filter(n=>n.kind==='chapter').length} chapters · ${state.skeleton.length} headings</span>
  </div>
</div>
${state.skeleton.map((n,i)=>`
<div class="node ${n.kind==='section'?'sub':n.kind==='subsection'?'subsub':''}">
  <div class="node-head">
    <span class="node-no">${n.kind==='chapter'?'Ch '+numberOf(n):numberOf(n)}</span>
    <input type="text" class="node-t" style="border:0;padding:2px 0;font-weight:${n.kind==='chapter'?600:500}" data-nodetitle="${n.id}" value="${esc(n.title)}">
    <select data-noderole="${n.id}" style="width:auto;max-width:210px;font-size:11.5px;padding:2px 5px">${ROLES.map(([k,v])=>`<option value="${k}" ${n.role===k?'selected':''}>${esc(v)}</option>`).join('')}</select>
    <select data-nodescope="${n.id}" style="width:auto;font-size:11.5px;padding:2px 5px">
      <option value="">any paper</option>
      ${state.papers.map(p=>`<option value="${p.id}" ${n.scope===p.id?'selected':''}>only ${p.code}</option>`).join('')}
    </select>
    <button class="btn ghost sm" data-nodeup="${n.id}" ${i===0?'disabled':''}>↑</button>
    <button class="btn ghost sm" data-nodedown="${n.id}" ${i===state.skeleton.length-1?'disabled':''}>↓</button>
    <button class="btn danger sm" data-nodedel="${n.id}">×</button>
  </div>
  <div class="spine">${spineFor(n)}</div>
</div>`).join('')}`;

VIEWS.route = () => {
  const loose = [];
  state.papers.forEach(p=>p.segments.forEach(s=>{ if(!s.placedIn && !HELD.includes(s.label)) loose.push({p,s}); }));
  const pickedSeg = state.picked ? segById(state.picked) : null;
  const wanted = pickedSeg ? (RULES[pickedSeg.label]||[]) : [];
  return `
<div class="stage-head"><h2>Placement</h2>
<p>${pickedSeg ? 'Now click the slot it belongs in. Suggested slots are highlighted.' : 'Click a piece on the left, then click where it goes. Or place everything at once and correct afterwards.'}</p></div>
<div class="panel">
  <div class="row">
    <button class="btn key" id="btnAuto">Place everything by purpose</button>
    <button class="btn ghost" id="btnAutoLoose" ${loose.length?'':'disabled'}>Place the ${loose.length} loose piece${loose.length===1?'':'s'}</button>
    <button class="btn ghost" id="btnClearAll">Unplace all</button>
    <div class="spacer"></div>
    ${state.picked?`<button class="btn ghost sm" id="btnUnpick">Cancel selection</button>`:''}
  </div>
</div>
<div class="split">
  <div>
    <h3 style="font-size:13px;margin:0 0 8px">Loose pieces <span class="mut" style="font-weight:400">${loose.length}</span></h3>
    ${loose.length ? loose.map(({p,s})=>`
      <div class="slug ${state.picked===s.id?'picked':''}" data-pick="${s.id}">
        <div class="slug-band" style="background:${p.color}"></div>
        <div class="slug-main">
          <div class="slug-top"><span>${p.code}</span><span class="chip">${esc(LABEL_NAME[s.label])}</span><span>${s.wc}w</span></div>
          <div class="slug-h">${esc(s.heading)}</div>
          <div class="slug-x">${esc(s.text.slice(0,110))}…</div>
        </div>
      </div>`).join('')
      : `<div class="empty"><strong>Everything is set</strong>Nothing is waiting to be placed.</div>`}
    ${state.papers.some(p=>p.segments.some(s=>s.label==='abstract')) ? `
    <details class="fold" style="margin-top:10px"><summary>Abstracts are held back (${state.papers.filter(p=>p.segments.some(s=>s.label==='abstract')).length})</summary>
    <div class="tiny mut">Paper abstracts are not carried into chapters. They are used on the Front &amp; back matter step to draft the thesis abstract.</div></details>`:''}
  </div>
  <div>
    <h3 style="font-size:13px;margin:0 0 8px">The thesis</h3>
    ${state.skeleton.map(n=>{
      const strong = pickedSeg && wanted.includes(n.role) && (!n.scope || n.scope===paperOfSeg(pickedSeg.id)?.id);
      return `
      <div class="node ${n.kind==='section'?'sub':n.kind==='subsection'?'subsub':''} ${strong?'target':''} ${pickedSeg?'droppable':''}" ${pickedSeg?`data-drop="${n.id}"`:''}>
        <div class="node-head">
          <span class="node-no">${n.kind==='chapter'?'Ch '+numberOf(n):numberOf(n)}</span>
          <span class="node-t">${esc(n.title)}</span>
          ${strong?'<span class="chip b">suggested</span>':''}
          ${n.scope?`<span class="chip" style="border-color:${state.papers.find(p=>p.id===n.scope)?.color}">${state.papers.find(p=>p.id===n.scope)?.code} only</span>`:''}
          <span class="chip">${n.blocks.length}</span>
        </div>
        <div class="spine">${spineFor(n)}</div>
        ${n.blocks.length?`<div class="blocks">${n.blocks.map((b,bi)=>{
          const s=segById(b.segId); if(!s) return '';
          const p=paperOfSeg(s.id);
          return `<div class="blk">
            <span class="blk-dot" style="background:${p?p.color:'#999'}"></span>
            <span class="blk-t">${esc(s.heading)} <span class="mut">· ${s.wc}w</span></span>
            <button class="btn ghost sm" data-blkup="${n.id}|${bi}" ${bi===0?'disabled':''}>↑</button>
            <button class="btn ghost sm" data-blkdown="${n.id}|${bi}" ${bi===n.blocks.length-1?'disabled':''}>↓</button>
            <button class="btn ghost sm" data-unplace="${s.id}">out</button>
          </div>`;
        }).join('')}</div>`:''}
      </div>`;
    }).join('')}
  </div>
</div>`;
};

VIEWS.stitch = () => {
  const hits = scanRecast();
  const cats = [...new Set(hits.map(h=>h.cat))];
  return `
<div class="stage-head"><h2>Stitching</h2>
<p>Six papers stitched together still sound like six papers. This step finds the seams: sentences that talk about “this paper”, cross-references that no longer point anywhere, and passages that say the same thing twice.</p></div>
<div class="panel">
  <h3>Voice and self-reference</h3>
  <p>${hits.length} phrase${hits.length===1?'':'s'} in placed text still read as journal writing.</p>
  ${cats.length ? `<div class="row" style="margin-bottom:10px">${cats.map(c=>`<label class="chip"><input type="checkbox" class="recast-cat" value="${esc(c)}" checked style="margin-right:4px">${esc(c)} · ${hits.filter(h=>h.cat===c).length}</label>`).join('')}</div>
  <div class="row"><button class="btn key" id="btnRecast">Recast the selected kinds</button><span class="tiny mut">Changes the placed text. Save the project first if you want a way back.</span></div>
  <div style="margin-top:12px;max-height:340px;overflow:auto">
    ${hits.slice(0,40).map(h=>{
      const s=segById(h.segId), p=paperOfSeg(h.segId), n=nodeById(h.nodeId);
      return `<div class="flag ${/cross-ref/i.test(h.cat)?'':'warn'}">
        <h5>${esc(h.cat)} <span class="mut" style="font-weight:400">· ${p?p.code:''} → ${esc(n?n.title:'')}</span></h5>
        <div class="quote">…${esc(h.ctx).replace(esc(h.match),'<mark>'+esc(h.match)+'</mark>')}…</div>
      </div>`;
    }).join('')}
    ${hits.length>40?`<p class="tiny mut">…and ${hits.length-40} more.</p>`:''}
  </div>` : `<div class="empty"><strong>Nothing flagged</strong>Either the text is already in thesis voice, or nothing has been placed yet.</div>`}
</div>
<div class="panel">
  <h3>Repeated passages</h3>
  <p>Papers reuse their own framing. Anything that appears twice in the thesis body is worth cutting to once.</p>
  <div class="row"><button class="btn ghost" id="btnOverlap">Look for repeats</button><span class="tiny mut">Compares every placed paragraph against every other.</span></div>
  <div id="overlapOut" style="margin-top:12px"></div>
</div>
<div class="panel">
  <h3>Bridges between chapters</h3>
  <p>A short passage at the head of a chapter saying where the reader has arrived from, and one at the foot saying where they go next.</p>
  ${state.skeleton.filter(n=>n.kind==='chapter').map(n=>`
    <details class="fold"><summary>Chapter ${numberOf(n)} — ${esc(n.title)}</summary><div>
      <label class="f"><span>Opening bridge</span><textarea data-bridge="${n.id}|open" rows="3">${esc((n.blocks.find(b=>b.kind==='bridge'&&b.at==='open')||{}).text||'')}</textarea></label>
      <button class="btn ghost sm" data-writebridge="${n.id}">Draft one with writing assist</button>
    </div></details>`).join('')}
</div>`;
};

    <td><button class="btn danger sm" data-delref="${r.id}">×</button></td></tr>`).join('') || '<tr><td colspan="4" class="mut tiny">No references picked up. Make sure each paper\u2019s reference list is labelled “Reference list” on the Segments step, then re-read.</td></tr>'}

<div class="panel">
  <h3>Against the format profile</h3>

    <span class="check-m ${c.ok?'ok':'no'}">${c.ok?'✓':'✗'}</span>

</div>
<div class="panel">

VIEWS.help = () => `
<div class="stage-head"><h2>How this works</h2>
<p>A compilation thesis is a routing problem before it is a writing problem. This tool takes that part off your hands and leaves you the part only you can do.</p></div>
<div class="panel">
  <h3>The idea</h3>
  <p style="max-width:68ch">Each paper is cut into labelled pieces — its literature review, its method, its results. Each slot in your chapter list is marked with what it is <em>for</em>. Placement is then a matter of matching the two: every paper's literature review flows into the chapter marked “Literature review”, every study's method into the chapter scoped to that study. Nothing is guessed at; you can see and change every rule and every placement.</p>
</div>
<div class="panel">
  <h3>What each step does</h3>
  <table class="data"><tbody>
    <tr><td style="width:150px"><b>Thesis details</b></td><td>Fills the title page, certificate, declaration and publication list.</td></tr>
    <tr><td><b>Papers</b></td><td>Reads PDF, Word, text and Markdown in the browser. Nothing is uploaded anywhere.</td></tr>
    <tr><td><b>Segments</b></td><td>Shows what the splitter thinks each part of each paper is. Correct it here — this is the highest-leverage screen in the tool.</td></tr>
    <tr><td><b>Chapters</b></td><td>Your structure, plus the purpose of each slot. Scope a chapter to one paper to keep a study's material together.</td></tr>
    <tr><td><b>Placement</b></td><td>Where material lands. Auto-place first, then correct by hand.</td></tr>
    <tr><td><b>Stitching</b></td><td>Finds journal voice, dead cross-references and passages you have written twice.</td></tr>
    <tr><td><b>Front &amp; back matter</b></td><td>Builds everything that is not a chapter, and renumbers figures and tables chapter-wise.</td></tr>
    <tr><td><b>References</b></td><td>Merges six reference lists into one and folds duplicates together.</td></tr>
    <tr><td><b>Proof check</b></td><td>Runs the format profile and the balance of sources across chapters.</td></tr>
  </tbody></table>
</div>
<div class="panel">
  <h3>What it will not do</h3>
  <p style="max-width:68ch">It will not write your argument. A thesis is not six papers in a row — the difference is the connective tissue: the synthesis chapter that reads the studies against each other, the framing that makes six separate contributions into one. The tool gets the mechanical work out of the way so that the connective tissue is what you spend your time on.</p>
  <p style="max-width:68ch">It also cannot confirm your department's current format circular. The profile follows the settings IIT Delhi theses normally use — A4, Times New Roman at 12 pt, one-and-a-half spacing, a 35 mm binding margin and 25 mm elsewhere, roman numerals in the front matter — but check it against what the PG section gives you and change anything that differs.</p>
</div>
<div class="panel">
  <h3>Your work</h3>
  <p>Nothing leaves the browser and nothing is stored between sessions. Save the project regularly; the file holds everything, including the text of your papers.</p>
</div>`;
