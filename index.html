function render(){
  const el = $('#stage');
  el.innerHTML = (VIEWS[state.view]||VIEWS.setup)();
  $$('.rail-btn').forEach(b=>b.classList.toggle('on', b.dataset.view===state.view));
  fieldBind(el);
  wire(el);
  updateChrome();
  if(state.view==='output') paintPreview();
  el.scrollTop = 0;
}

function paintPreview(){
  const f = state.format;
  const pv = $('#preview');
  pv.style.width = f.pageW+'mm';
  pv.style.padding = `${f.marginTop}mm ${f.marginOuter}mm ${f.marginBottom}mm ${f.marginBind}mm`;
  pv.innerHTML = `<style>${docStyles(false)}</style>` + buildDocument(false);
}

const PRESETS = {
  dsrm: defaultSkeleton,
  classic: () => {
    const C=(t,r,b)=>({id:uid('n'),kind:'chapter',title:t,role:r,scope:'',brief:b||'',blocks:[]});
    const S=(t,r)=>({id:uid('n'),kind:'section',title:t,role:r,scope:'',brief:'',blocks:[]});
    return [C('Introduction','r_context'),S('Background','r_context'),S('Research gap','r_gap'),S('Objectives','r_aims'),
      C('Literature review','r_lit'),S('State of the art','r_lit'),S('Synthesis','r_gap'),
      C('Methodology','r_method'),S('Research design','r_method'),S('Data collection','r_studymeth'),S('Analysis','r_studymeth'),
      C('Results and discussion','r_studyres'),S('Findings','r_studyres'),S('Discussion','r_studydisc'),S('Implications','r_implic'),
      C('Conclusions','r_concl'),S('Conclusions','r_concl'),S('Limitations','r_limits'),S('Future work','r_future')];
  },
  compilation: () => {
    const C=(t,r,scope)=>({id:uid('n'),kind:'chapter',title:t,role:r,scope:scope||'',brief:'',blocks:[]});
    const S=(t,r,scope)=>({id:uid('n'),kind:'section',title:t,role:r,scope:scope||'',brief:'',blocks:[]});
    const out=[C('Introduction','r_context'),S('Motivation','r_context'),S('Objectives','r_aims'),S('Structure of the thesis','none'),
      C('Literature review','r_lit'),S('State of the art','r_lit'),S('Research gap','r_gap'),
      C('Research methodology','r_method'),S('Overall design','r_method')];
    state.papers.forEach((p,i)=>{
      out.push(C('Study '+(i+1)+' — '+p.title.slice(0,52),'r_studyres',p.id));
      out.push(S('Method','r_studymeth',p.id));
      out.push(S('Results','r_studyres',p.id));
      out.push(S('Discussion','r_studydisc',p.id));
    });
    out.push(C('Synthesis and discussion','r_synth'),S('Reading the studies together','r_synth'),S('Contributions','r_implic'),S('Limitations','r_limits'));
    out.push(C('Conclusions and future work','r_concl'),S('Conclusions','r_concl'),S('Future work','r_future'));
    return out;
  },
  blank: () => [{id:uid('n'),kind:'chapter',title:'Introduction',role:'r_context',scope:'',brief:'',blocks:[]}]
};

function wire(root){
  /* setup presets */
  bind('[data-preset]','click',e=>{
    const k=e.currentTarget.dataset.preset;
    state.papers.forEach(p=>p.segments.forEach(s=>s.placedIn=null));
    state.skeleton = PRESETS[k]();
    toast('Chapter list replaced.'); render();
  },root);

  /* papers */
  const fp = $('#filePapers',root);
  if(fp){
    $('#btnPick',root).onclick = ()=>fp.click();
    fp.onchange = async e=>{
      const files=[...e.target.files]; if(!files.length) return;
      toast('Reading '+files.length+' file'+(files.length===1?'':'s')+'…');
      for(const f of files){
        try{ const t = await readAnyFile(f); if(!t.trim()){ toast('No text found in '+f.name); continue; } addPaper(f.name, t); }
        catch(err){ toast(err.message); }
      }
      fp.value=''; render();
    };
    $('#btnPaste',root).onclick = ()=>{ const b=$('#pasteBox',root); b.hidden=!b.hidden; };
    $('#btnPasteAdd',root).onclick = ()=>{
      const t=$('#pasteText',root).value;
      if(!t.trim()) return toast('Paste the paper text first.');
      addPaper($('#pasteName',root).value||'Pasted paper', t); render();
    };
  }
  bind('[data-paper]','input',e=>{
    const p=state.papers.find(x=>x.id===e.target.dataset.paper);
    if(p){ p[e.target.dataset.key]=e.target.value; updateChrome(); }
  },root);
  bind('[data-delpaper]','click',e=>{
    const id=e.currentTarget.dataset.delpaper;
    const p=state.papers.find(x=>x.id===id); if(!p) return;
    if(!confirm('Remove '+p.code+' and everything placed from it?')) return;
    p.segments.forEach(s=>unplaceSeg(s.id));
    state.papers = state.papers.filter(x=>x.id!==id);
    state.figures = state.figures.filter(c=>c.paperId!==id);
    state.tables = state.tables.filter(c=>c.paperId!==id);
    state.refs.forEach(r=>r.from=r.from.filter(x=>x!==id));
    state.refs = state.refs.filter(r=>r.from.length);
    state.papers.forEach((x,i)=>{ x.code='P'+(i+1); x.color=INK[i%INK.length]; });
    render();
  },root);
  bind('[data-resplit]','click',e=>{
    const p=state.papers.find(x=>x.id===e.currentTarget.dataset.resplit); if(!p) return;
    p.segments.forEach(s=>unplaceSeg(s.id));
    let segs = segmentText(p.raw); if(segs.length<3) segs=segmentFallback(p.raw);
    p.segments = segs; toast('Re-split into '+segs.length+' segments.'); render();
  },root);

  /* segments */
  bind('[data-seglabel]','change',e=>{
    const s=segById(e.target.dataset.seglabel); if(s){ s.label=e.target.value; updateChrome(); }
  },root);
  bind('[data-viewseg]','click',e=>{
    const s=segById(e.currentTarget.dataset.viewseg); if(!s) return;
    const p=paperOfSeg(s.id);
    $('#segReader',root).innerHTML = `<div class="panel" style="border-left:4px solid ${p.color}">
      <div class="row"><h3 style="flex:1">${esc(s.heading)}</h3><button class="btn ghost sm" id="closeSeg">Close</button></div>
      <p class="tiny mut">${p.code} · ${esc(LABEL_NAME[s.label])} · ${s.wc} words</p>
      <textarea rows="14" data-segtext="${s.id}" style="font-family:var(--doc);font-size:14px">${esc(s.text)}</textarea>
      <p class="hint">Edits here go into the thesis. Word counts update when you click away.</p></div>`;
    $('#closeSeg',root).onclick=()=>{$('#segReader',root).innerHTML='';};
    $(`[data-segtext="${s.id}"]`,root).addEventListener('change',ev=>{ s.text=ev.target.value; s.wc=words(s.text); updateChrome(); });
    $('#segReader',root).scrollIntoView({behavior:'smooth',block:'nearest'});
  },root);
  const aiSeg = $('#btnAiSeg',root);
  if(aiSeg) aiSeg.onclick = async ()=>{
    aiSeg.disabled=true; aiSeg.textContent='Reading…';
    for(const p of state.papers){
      const list = p.segments.map((s,i)=>`${i}. "${s.heading}" — ${s.text.slice(0,180).replace(/\s+/g,' ')}`).join('\n');
      const out = await assist(
        `Label each numbered section of an academic paper with exactly one code from this list:\n${LABELS.map(([k,n])=>k+' = '+n).join('\n')}\n\nSections:\n${list}\n\nReply with only lines of the form index:code. No other text.`,
        'You classify sections of academic papers. Reply only in the requested format.');
      if(!out) break;
      out.split('\n').forEach(line=>{
        const m = line.match(/^\s*(\d+)\s*[:.]\s*([a-z]+)/i);
        if(m && p.segments[+m[1]] && LABEL_NAME[m[2]]) p.segments[+m[1]].label = m[2];
      });
    }
    render();
  };

  /* skeleton */
  bind('[data-add]','click',e=>{
    state.skeleton.push({id:uid('n'),kind:e.currentTarget.dataset.add,title:'New '+e.currentTarget.dataset.add,role:'none',scope:'',brief:'',blocks:[]});
    render();
  },root);
  bind('[data-nodetitle]','input',e=>{ const n=nodeById(e.target.dataset.nodetitle); if(n) n.title=e.target.value; },root);
  bind('[data-noderole]','change',e=>{ const n=nodeById(e.target.dataset.noderole); if(n) n.role=e.target.value; },root);
  bind('[data-nodescope]','change',e=>{ const n=nodeById(e.target.dataset.nodescope); if(n) n.scope=e.target.value; },root);
  const move=(id,d)=>{ const i=state.skeleton.findIndex(n=>n.id===id); const j=i+d;
    if(i<0||j<0||j>=state.skeleton.length) return;
    [state.skeleton[i],state.skeleton[j]]=[state.skeleton[j],state.skeleton[i]]; render(); };
  bind('[data-nodeup]','click',e=>move(e.currentTarget.dataset.nodeup,-1),root);
  bind('[data-nodedown]','click',e=>move(e.currentTarget.dataset.nodedown,1),root);
  bind('[data-nodedel]','click',e=>{
    const n=nodeById(e.currentTarget.dataset.nodedel); if(!n) return;
    if(n.blocks.length && !confirm('That slot holds '+n.blocks.length+' piece(s). They will be unplaced. Continue?')) return;
    n.blocks.forEach(b=>{const s=segById(b.segId); if(s) s.placedIn=null;});
    state.skeleton = state.skeleton.filter(x=>x.id!==n.id); render();
  },root);

  /* placement */
  const auto = $('#btnAuto',root);
  if(auto) auto.onclick=()=>{ const r=autoPlace(false); toast(`${r.placed} placed, ${r.skipped} left aside.`); render(); };
  const autoL = $('#btnAutoLoose',root);
  if(autoL) autoL.onclick=()=>{ const r=autoPlace(true); toast(`${r.placed} placed.`); render(); };
  const clr = $('#btnClearAll',root);
  if(clr) clr.onclick=()=>{ if(!confirm('Unplace everything?')) return;
    state.skeleton.forEach(n=>n.blocks=[]); state.papers.forEach(p=>p.segments.forEach(s=>s.placedIn=null)); state.picked=null; render(); };
  const unp = $('#btnUnpick',root); if(unp) unp.onclick=()=>{ state.picked=null; render(); };
  bind('[data-pick]','click',e=>{
    const id=e.currentTarget.dataset.pick;
    state.picked = state.picked===id ? null : id; render();
  },root);
  bind('[data-drop]','click',e=>{
    if(!state.picked) return;
    placeSeg(state.picked, e.currentTarget.dataset.drop);
    state.picked=null; renumberCaptions(); render();
  },root);
  bind('[data-unplace]','click',e=>{ e.stopPropagation(); unplaceSeg(e.currentTarget.dataset.unplace); renumberCaptions(); render(); },root);
  const blkMove=(key,d)=>{ const [nid,bi]=key.split('|'); const n=nodeById(nid); const i=+bi, j=i+d;
    if(!n||j<0||j>=n.blocks.length) return; [n.blocks[i],n.blocks[j]]=[n.blocks[j],n.blocks[i]]; render(); };
  bind('[data-blkup]','click',e=>{e.stopPropagation();blkMove(e.currentTarget.dataset.blkup,-1);},root);
  bind('[data-blkdown]','click',e=>{e.stopPropagation();blkMove(e.currentTarget.dataset.blkdown,1);},root);

  /* stitch */
  const rc = $('#btnRecast',root);
  if(rc) rc.onclick=()=>{
    const cats = $$('.recast-cat',root).filter(c=>c.checked).map(c=>c.value);
    if(!cats.length) return toast('Pick at least one kind.');
    const n = applyRecast(cats); toast(n+' passage'+(n===1?'':'s')+' recast.'); render();
  };
  const ov = $('#btnOverlap',root);
  if(ov) ov.onclick=()=>{
    ov.disabled=true; ov.textContent='Comparing…';
    setTimeout(()=>{
      const hits = findOverlaps();
      $('#overlapOut',root).innerHTML = hits.length ? hits.slice(0,20).map(h=>`
        <div class="flag">
          <h5>${Math.round(h.j*100)}% shared wording · ${h.a.paper?h.a.paper.code:'?'} → ${esc(h.a.node.title)} &nbsp;vs&nbsp; ${h.b.paper?h.b.paper.code:'?'} → ${esc(h.b.node.title)}</h5>
          <div class="quote">${esc(h.a.text.slice(0,240))}…</div>
          <div class="quote">${esc(h.b.text.slice(0,240))}…</div>
        </div>`).join('') + (hits.length>20?`<p class="tiny mut">…and ${hits.length-20} more pairs.</p>`:'')
        : `<div class="empty"><strong>No repeated passages found</strong>Nothing above 16% shared wording between paragraphs from different papers.</div>`;
      ov.disabled=false; ov.textContent='Look for repeats';
    }, 30);
  };
  bind('[data-writebridge]','click',async e=>{
    const n = nodeById(e.currentTarget.dataset.writebridge); if(!n) return;
    const i = state.skeleton.indexOf(n);
    const prev = state.skeleton.slice(0,i).reverse().find(x=>x.kind==='chapter');
    const btn = e.currentTarget; btn.disabled=true; btn.textContent='Drafting…';
    const out = await assist(
      `Write a single linking paragraph, 70 to 110 words, that opens a PhD thesis chapter. It should recall what the previous chapter established and state what this chapter does, in an academic register, first person singular, British spelling. Do not use headings or lists.\n\nPrevious chapter: "${prev?prev.title:'the introduction'}"\nThis chapter: "${n.title}"\nWhat this chapter covers: ${n.brief||'see title'}\nThesis topic: ${M('title')||'a design research thesis'}`,
      'You write connective prose for doctoral theses. Return only the paragraph.');
    btn.disabled=false; btn.textContent='Draft one with writing assist';
    if(!out) return;
    n.blocks = n.blocks.filter(b=>!(b.kind==='bridge'&&b.at==='open'));
    n.blocks.unshift({kind:'bridge', at:'open', text:out});
    render();
  },root);
  bind('[data-bridge]','change',e=>{
    const [nid] = e.target.dataset.bridge.split('|');
    const n=nodeById(nid); if(!n) return;
    n.blocks = n.blocks.filter(b=>!(b.kind==='bridge'&&b.at==='open'));
    if(e.target.value.trim()) n.blocks.unshift({kind:'bridge',at:'open',text:e.target.value});
  },root);

  /* front matter */
  const ba=$('#btnBuildAck',root);
  if(ba) ba.onclick=()=>{ state.front.acknowledgement = genAcknowledgement(); render(); };
  const da=$('#btnDraftAbstract',root);
  if(da) da.onclick=async()=>{
    const abs = state.papers.flatMap(p=>p.segments.filter(s=>s.label==='abstract').map(s=>p.code+': '+s.text));
    if(!abs.length) return toast('No paper abstracts found. Label them on the Segments step.');
    da.disabled=true; da.textContent='Drafting…';
    const out = await assist(
      `Write one PhD thesis abstract of ${Math.min(500,state.format.abstractWordCap)} words or fewer from these abstracts of the candidate's published papers. It must read as one continuous argument, not a summary of separate studies: state the problem, the approach, what was found across the studies, and the contribution. Academic register, first person singular where a voice is needed, British spelling, no headings or lists.\n\nThesis title: ${M('title')}\nChapters: ${state.skeleton.filter(n=>n.kind==='chapter').map(n=>n.title).join('; ')}\n\nPaper abstracts:\n${abs.join('\n\n')}`,
      'You write abstracts for doctoral theses. Return only the abstract text.');
    da.disabled=false; da.textContent='Draft from the paper abstracts';
    if(out){ state.front.abstract = out; render(); }
  };
  const rn=$('#btnRenumber',root); if(rn) rn.onclick=()=>{ renumberCaptions(); toast('Renumbered chapter-wise.'); render(); };
  const ab=$('#btnAbbrev',root); if(ab) ab.onclick=()=>{ detectAbbrev(); toast(state.abbrev.length+' abbreviation(s).'); render(); };
  const aab=$('#btnAddAbbrev',root); if(aab) aab.onclick=()=>{ state.abbrev.push({id:uid('a'),short:'',long:''}); render(); };
  bind('[data-cap]','input',e=>{ const c=[...state.figures,...state.tables].find(x=>x.id===e.target.dataset.cap); if(c) c.caption=e.target.value; },root);
  bind('[data-delcap]','click',e=>{ const id=e.currentTarget.dataset.delcap;
    state.figures=state.figures.filter(c=>c.id!==id); state.tables=state.tables.filter(c=>c.id!==id); render(); },root);
  bind('[data-ab]','input',e=>{ const a=state.abbrev.find(x=>x.id===e.target.dataset.ab); if(a) a[e.target.dataset.abk]=e.target.value; },root);
  bind('[data-delab]','click',e=>{ state.abbrev=state.abbrev.filter(a=>a.id!==e.currentTarget.dataset.delab); render(); },root);

  /* references */
  const rh=$('#btnReharvest',root);
  if(rh) rh.onclick=()=>{ state.refs=[]; state.papers.forEach(harvestRefs); toast(state.refs.length+' reference(s) merged.'); render(); };
  const ar=$('#btnAddRef',root); if(ar) ar.onclick=()=>{ state.refs.unshift({id:uid('r'),key:uid('k'),raw:'',from:[],keep:true}); render(); };
  const sr=$('#btnSortRefs',root); if(sr) sr.onclick=()=>{ sortRefs(); render(); };
  bind('[data-refkeep]','change',e=>{ const r=state.refs.find(x=>x.id===e.target.dataset.refkeep); if(r){r.keep=e.target.checked; updateChrome();} },root);
  bind('[data-refraw]','input',e=>{ const r=state.refs.find(x=>x.id===e.target.dataset.refraw); if(r) r.raw=e.target.value; },root);
  bind('[data-delref]','click',e=>{ state.refs=state.refs.filter(r=>r.id!==e.currentTarget.dataset.delref); render(); },root);

  /* format */
  const rf=$('#btnResetFormat',root); if(rf) rf.onclick=()=>{ state.format=iitdFormat(); toast('Profile reset.'); render(); };
  const ak=$('#aiKey',root); if(ak) ak.addEventListener('input',()=>{ state.ai.key=ak.value.trim(); });

  /* output */
  const bw=$('#btnWord',root); if(bw) bw.onclick=exportWord;
  const bp=$('#btnPrint',root); if(bp) bp.onclick=()=>window.print();
  const bt=$('#btnTex',root); if(bt) bt.onclick=exportLatex;
  const bm=$('#btnMd',root); if(bm) bm.onclick=exportMarkdown;
}

/* rail + global */
$$('.rail-btn').forEach(b=>b.addEventListener('click',()=>{ state.view=b.dataset.view; state.picked=null; render(); }));
$('#btnSave').onclick = exportProject;
$('#btnOpen').onclick = () => $('#fileProject').click();
$('#fileProject').onchange = async e => {
  const f=e.target.files[0]; if(!f) return;
  importProject(await f.text()); e.target.value='';
};
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && state.picked){ state.picked=null; render(); }
  if((e.metaKey||e.ctrlKey) && e.key==='s'){ e.preventDefault(); exportProject(); }
});

render();
</script>
</body>
</html>
